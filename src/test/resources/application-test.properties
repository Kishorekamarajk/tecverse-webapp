# Never inherit DB_URL or other production datasource settings in tests.
# This database must be created locally and is isolated from all deployment DBs.
spring.datasource.url=jdbc:postgresql://localhost:5432/tecverse_test
spring.datasource.username=${TEST_DB_USERNAME:tecverse_test}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tests use disposable state in the dedicated test database. Hibernate derives
# the dialect from PostgreSQL JDBC metadata; do not mask connection failures.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1000

# Avoid outbound integrations during tests.
tecverse.social.youtube.enabled=false
spring.mail.test-connection=false
