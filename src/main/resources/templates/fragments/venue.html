<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="venue" id="venue" class="venue-showcase venue-plan" aria-labelledby="venue-heading">
    <div class="venue-guide-layout d-flex flex-column flex-lg-row gap-3 gap-lg-4">
        <article class="venue-event-card col-11 col-sm-10 col-md-9 col-lg mx-auto mx-lg-0 p-3 p-sm-4" data-reveal="fade-up">
            <span class="venue-plan__eyebrow"><i class="bi bi-geo-alt-fill"></i> <span th:text="#{venue.guide}">Venue guide</span></span>
            <h2 id="venue-heading"><span th:text="#{venue.event.heading.start}">Event</span> <em th:text="#{venue.event.heading.emphasis}">Location</em></h2>
            <h3 th:text="#{venue.name}">Chennai Trade Centre</h3>
            <p class="venue-event-address"><i class="bi bi-geo-alt-fill"></i><span th:text="#{venue.address}">Ramapuram, Nandambakkam, Chennai, Tamil Nadu 600089, India</span></p>
            <p class="venue-event-date"><i class="bi bi-calendar-event-fill"></i><span><strong th:text="#{venue.event.date.label}">Date:</strong> <span th:text="#{venue.event.date.value}">26–27 November 2026</span></span></p>
            <div class="venue-event-actions">
                <a href="https://www.google.com/maps/search/?api=1&amp;query=Chennai+Trade+Centre%2C+Nandambakkam%2C+Chennai" target="_blank" rel="noopener noreferrer"><i class="bi bi-sign-turn-right-fill"></i> <span th:text="#{venue.directions}">Get directions</span></a>
                <a th:href="@{/inquiry}"><i class="bi bi-envelope-fill"></i> <span th:text="#{venue.accommodation}">Accommodation</span></a>
            </div>
        </article>
        <div class="venue-guide-map col-12 col-lg" data-reveal="fade-up" data-reveal-delay="100">
            <iframe th:if="${!#strings.isEmpty(@environment.getProperty('tecverse.google.maps.embed-api-key'))}"
                    th:src="@{https://www.google.com/maps/embed/v1/place(key=${@environment.getProperty('tecverse.google.maps.embed-api-key')},q='Chennai Trade Centre, Nandambakkam, Chennai, Tamil Nadu, India',zoom=15)}"
                    loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Interactive map showing Chennai Trade Centre, Nandambakkam, Chennai" th:title="#{misc.venue.mapTitle}" allowfullscreen credentialless></iframe>
            <a th:unless="${!#strings.isEmpty(@environment.getProperty('tecverse.google.maps.embed-api-key'))}"
               href="https://www.google.com/maps/search/?api=1&amp;query=Chennai+Trade+Centre%2C+Nandambakkam%2C+Chennai" target="_blank" rel="noopener noreferrer" th:text="#{misc.venue.openMap}">Open Chennai Trade Centre in Google Maps</a>
        </div>
    </div>
</section>
</body>
</html>
