<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Step 2 of ticket registration. Served only by /ticket/details-step to a session that has
     completed OTP verification on the server, so a forged client response cannot reveal it. -->
            <form th:fragment="detailsStep" id="detailsForm" class="tr-view" data-view="details" hidden>
              <div class="rg-sec"><i class="bi bi-person-vcard"></i><h3>Details</h3></div>
              <div class="row g-3">
                <div class="col-12"><label class="rg-f">Full Name <span class="tr-required-star" aria-hidden="true">*</span><input class="form-control" name="officialName" placeholder="Full name" required maxlength="150"></label></div>
                <div class="col-12 col-md-6"><label class="rg-f">Category of Participation<span class="tr-required-star" aria-hidden="true">*</span>
                  <select class="form-select" name="category" id="category" required>
                    <option value="">Select category</option>
                    <option value="ACADEMIA">Academia</option>
                    <option value="CENTRAL_GOVERNMENT">Central Government</option>
                    <option value="STATE_GOVERNMENT">State Government</option>
                    <option value="INDUSTRY_STARTUP">Industry / Business</option>
                    <!--
                    <option value="VIP_SPECIAL_INVITEE">VIP / Special Invitee</option>
                    <option value="SPEAKER">Speaker</option>
                    <option value="ORGANIZER">Organizer</option>
                    -->
                  </select></label></div>
                <div class="col-12 col-md-6"><label class="rg-f">Nationality / Residency Status<span class="tr-required-star" aria-hidden="true">*</span>
                  <select class="form-select" name="citizenshipStatus" id="citizenship" required>
                    <option value="">Select status</option>
                    <option value="INDIAN">Indian National</option>
                    <option value="NRI">Non-Resident Indian (NRI)</option>
                    <option value="FOREIGNER">Foreign National</option>
                  </select></label></div>
              </div>

              <div id="conditional" class="mt-3"></div>

              <fieldset class="tr-fieldset">
                <legend>Preferred Day(s) <span class="tr-required-star" aria-hidden="true">*</span></legend>
                <p>Select the day(s) you will attend.</p>
                <div class="rg-days">
                  <label class="tr-check form-check"><input class="form-check-input" type="checkbox" name="attendanceDays" value="DAY_1"><span>Day 1 – 26 November 2026</span></label>
                  <label class="tr-check form-check"><input class="form-check-input" type="checkbox" name="attendanceDays" value="DAY_2"><span>Day 2 – 27 November 2026</span></label>
                  <label class="tr-check form-check"><input class="form-check-input" type="checkbox" name="attendanceDays" value="BOTH"><span>Both Days – 26 &amp; 27 November 2026</span></label>
                </div>
              </fieldset>
              <div id="detailsMsg" class="tr-msg"></div>
              <div class="rg-actions">
                <button type="button" id="backVerify" class="btn tr-secondary"><i class="bi bi-arrow-left"></i> Back</button>
                <button type="submit" class="btn tr-primary">Review Application <i class="bi bi-arrow-right"></i></button>
              </div>
            </form>
</body>
</html>
