<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="exhibitors" id="exhibitors" aria-labelledby="exhibitors-heading"
         class="exhibitors-glass-section relative isolate overflow-hidden">

    <div class="container-custom relative z-10">
        <div class="exhibitors-heading-wrap text-center" data-reveal="fade-up">
            <p class="exhibitors-eyebrow"><th:block th:text="#{misc.exhibitors.eyebrow.people}">PEOPLE</th:block> <span>•</span> <th:block th:text="#{misc.exhibitors.eyebrow.ideas}">IDEAS</th:block> <span>•</span> <th:block th:text="#{misc.exhibitors.eyebrow.technology}">TECHNOLOGY</th:block> <span>•</span> <th:block th:text="#{misc.exhibitors.eyebrow.tomorrow}">A BETTER TOMORROW</th:block></p>
            <h2 id="exhibitors-heading" class="exhibitors-glass-heading font-sans">
                <span th:text="#{exhibitors.heading}">OUR EXHIBITORS 2026</span>
            </h2>
            <span class="section-heading-rule exhibitors-heading-rule overflow-hidden" aria-hidden="true"><span></span><span></span><span></span></span>
            <p class="exhibitors-glass-subtitle" th:text="#{exhibitors.subtitle}">Partnering for innovation. Building the future together.</p>
        </div>

        <p th:if="${homeExhibitors == null or homeExhibitors.isEmpty()}" class="exhibitors-update-soon" th:text="#{exhibitors.updateSoon}">Exhibitors will be updated soon.</p>

           
        <ul th:if="${homeExhibitors != null and !homeExhibitors.isEmpty()}" class="exhibitors-glass-grid exhibitors-database-grid" data-reveal="fade-up" data-reveal-delay="100">
            <li class="exhibitor-glass-card exhibitor-flip-card" th:each="exhibitor : ${homeExhibitors}">
                <div class="exhibitor-flip-inner">
                    <div class="exhibitor-flip-face exhibitor-flip-front">
                        <a th:if="${!#strings.isEmpty(exhibitor.websiteUrl)}" th:href="${exhibitor.websiteUrl}" target="_blank" rel="noopener noreferrer" th:aria-label="|Visit ${exhibitor.companyName} website|">
                            <img class="exhibitor-glass-logo" th:src="@{${exhibitor.imageUrl}}" th:alt="#{misc.exhibitors.companyLogoAlt(${exhibitor.companyName})}" loading="lazy">
                        </a>
                        <img th:unless="${!#strings.isEmpty(exhibitor.websiteUrl)}" class="exhibitor-glass-logo" th:src="@{${exhibitor.imageUrl}}" th:alt="#{misc.exhibitors.companyLogoAlt(${exhibitor.companyName})}" loading="lazy">
                    </div>
                    <div class="exhibitor-flip-face exhibitor-flip-back">
                        <strong th:text="${exhibitor.stallAllocation}">3 × 6</strong>
                    </div>
                </div>
            </li>
        </ul>

    </div>
</section>

</body>
</html>
