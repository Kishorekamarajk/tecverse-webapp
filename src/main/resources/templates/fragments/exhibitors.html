<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="exhibitors" id="exhibitors" aria-labelledby="exhibitors-heading"
         class="exhibitors-glass-section relative isolate overflow-hidden">

    <div class="container-custom relative z-10">
        <div class="exhibitors-heading-wrap text-center" data-reveal="fade-up">
            <p class="exhibitors-eyebrow">PEOPLE <span>•</span> IDEAS <span>•</span> TECHNOLOGY <span>•</span> A BETTER TOMORROW</p>
            <h2 id="exhibitors-heading" class="exhibitors-glass-heading font-sans">
                <span th:text="#{exhibitors.heading}">OUR EXHIBITORS 2026</span>
            </h2>
            <span class="section-heading-rule exhibitors-heading-rule overflow-hidden" aria-hidden="true"><span></span><span></span><span></span></span>
            <p class="exhibitors-glass-subtitle" th:text="#{exhibitors.subtitle}">Partnering for innovation. Building the future together.</p>
        </div>

        <ul th:if="${homeExhibitors != null and !homeExhibitors.isEmpty()}" class="exhibitors-glass-grid exhibitors-database-grid" data-reveal="fade-up" data-reveal-delay="100">
            <li class="exhibitor-glass-card exhibitor-flip-card" th:each="exhibitor : ${homeExhibitors}">
                <div class="exhibitor-flip-inner">
                    <div class="exhibitor-flip-face exhibitor-flip-front">
                        <img class="exhibitor-glass-logo" th:src="@{${exhibitor.imageUrl}}" th:alt="|${exhibitor.companyName} logo|" loading="lazy">
                    </div>
                    <div class="exhibitor-flip-face exhibitor-flip-back">
                        <strong th:text="${exhibitor.stallAllocation}">3 × 6</strong>
                    </div>
                </div>
            </li>
        </ul>

        <ul th:if="${homeExhibitors == null or homeExhibitors.isEmpty()}" class="exhibitors-glass-grid" data-reveal="fade-up" data-reveal-delay="100">
            <li class="exhibitor-glass-card"><img class="exhibitor-glass-logo" th:src="@{/images/logo1.jpg}" alt="Exhibitor logo 1" loading="lazy"></li>
            <li class="exhibitor-glass-card"><img class="exhibitor-glass-logo" th:src="@{/images/logo2.jpg}" alt="Exhibitor logo 2" loading="lazy"></li>
