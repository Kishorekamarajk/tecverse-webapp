<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="floating-actions">
    <link rel="stylesheet" th:href="@{/css/tecverse-chatbot.css}">

    <!--
    <nav class="site-floating-actions" aria-label="Event participation">
        <a class="site-floating-actions__link text-decoration-none" th:href="@{/become-sponsor}">
            <i class="bi bi-award" aria-hidden="true"></i>
            <span class="position-relative">Become a Sponsor</span>
        </a>
        <a class="site-floating-actions__link text-decoration-none" th:href="@{/exhibitor-registration}">
            <i class="bi bi-shop" aria-hidden="true"></i>
            <span class="position-relative">Become an Exhibitor</span>
        </a>
    </nav>
    -->

    <nav aria-label="Social media links"
         class="site-social-rail fixed right-0 top-1/2 z-50 flex -translate-y-1/2 flex-col overflow-hidden shadow-[0_14px_30px_rgba(7,24,47,0.18)]">
        <a href="https://www.facebook.com/CDACINDIA/" target="_blank" rel="noopener" aria-label="Facebook"
           class="flex h-12 w-12 items-center justify-center bg-[#1877F2] text-white transition-transform duration-300 hover:-translate-x-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <i class="bi bi-facebook text-[23px] leading-none"></i>
        </a>
        <a href="https://www.linkedin.com/company/cdacindia/" target="_blank" rel="noopener" aria-label="LinkedIn"
           class="flex h-12 w-12 items-center justify-center bg-[#0A66C2] text-white transition-transform duration-300 hover:-translate-x-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <i class="bi bi-linkedin text-[21px] leading-none"></i>
        </a>
        <a href="https://www.instagram.com/c_dacindia/" target="_blank" rel="noopener" aria-label="Instagram"
           class="flex h-12 w-12 items-center justify-center bg-gradient-to-br from-[#F58529] via-[#DD2A7B] to-[#8134AF] text-white transition-transform duration-300 hover:-translate-x-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <i class="bi bi-instagram text-[21px] leading-none"></i>
        </a>
        <a href="https://www.youtube.com/@TecVerse-CDAC" target="_blank" rel="noopener" aria-label="YouTube"
           class="flex h-12 w-12 items-center justify-center bg-[#FF0000] text-white transition-transform duration-300 hover:-translate-x-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
            <i class="bi bi-youtube text-[22px] leading-none"></i>
        </a>
    </nav>

    <div class="tecverse-floating-actions position-fixed d-flex flex-column align-items-center" aria-label="Tec-verse support actions">
        <button type="button"
                class="tecverse-floating-actions__button tecverse-floating-actions__button--chat btn d-inline-flex align-items-center justify-content-center rounded-circle p-0"
                aria-label="Open Tec-verse Assistant"
                aria-controls="tecverse-chatbot"
                aria-expanded="false"
                data-tecverse-chatbot-open>
            <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
        </button>

        <a class="tecverse-floating-actions__button tecverse-floating-actions__button--whatsapp btn d-inline-flex align-items-center justify-content-center rounded-circle p-0"
           href="https://wa.me/910000000000"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Open WhatsApp"
           data-tecverse-whatsapp-link>
            <i class="bi bi-whatsapp" aria-hidden="true"></i>
        </a>
    </div>

    <section id="tecverse-chatbot"
             class="tecverse-chatbot position-fixed d-flex flex-column overflow-hidden col-10 col-sm-8 col-md-5 col-lg-4 col-xl-3 h-50"
             aria-labelledby="tecverse-chatbot-title"
             aria-hidden="true"
             data-tecverse-chatbot>
        <header class="tecverse-chatbot__header d-flex align-items-center justify-content-between gap-3">
            <div>
                <p class="tecverse-chatbot__eyebrow">Tec-verse ASSISTANT</p>
                <h2 id="tecverse-chatbot-title">Need quick help?</h2>
            </div>
            <button type="button"
                    class="tecverse-chatbot__close btn d-inline-flex align-items-center justify-content-center flex-shrink-0 rounded-circle p-0"
                    aria-label="Close Tec-verse Assistant"
                    data-tecverse-chatbot-close>
                &times;
            </button>
        </header>

        <div class="tecverse-chatbot__messages d-flex flex-column flex-grow-1 overflow-y-auto" data-tecverse-chatbot-messages></div>
        <div class="tecverse-chatbot__quick-questions d-flex flex-wrap flex-shrink-0 gap-2 overflow-y-auto" data-tecverse-quick-questions aria-label="Quick questions"></div>

        <form class="tecverse-chatbot__form d-flex align-items-center flex-shrink-0" data-tecverse-chatbot-form>
            <label class="tecverse-chatbot__label visually-hidden" for="tecverse-chatbot-input">Ask any Tec-verse question...</label>
            <input id="tecverse-chatbot-input"
                   class="tecverse-chatbot__input form-control rounded-pill"
                   type="text"
                   autocomplete="off"
                   placeholder="Ask any Tec-verse question..."
                   data-tecverse-chatbot-input>
            <button type="submit" class="tecverse-chatbot__send btn d-inline-flex align-items-center justify-content-center flex-shrink-0 rounded-circle p-0" aria-label="Send message">
                <i class="bi bi-send-fill" aria-hidden="true"></i>
            </button>
        </form>
    </section>

    <script th:src="@{/js/tecverse-chatbot.js}" defer></script>
</div>

</body>
</html>
