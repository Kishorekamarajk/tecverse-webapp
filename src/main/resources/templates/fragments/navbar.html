<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navbar(active)">
<nav class="navbar navbar-expand-xl site-navbar fixed-top">
    <div class="container-custom">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/tecverselogo.png}" alt="Tec-Verse logo" th:alt="#{misc.logo.tecverse}" class="navbar-logo d-block object-fit-contain" />
            <span class="navbar-brand-text" th:text="#{brand.name}">Tec-Verse 2026</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-label="Toggle navigation" th:aria-label="#{misc.navbar.toggleAria}">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="mainNavLabel">
                    <a class="offcanvas-title-link" th:href="@{/}" th:text="#{contact.title}">Tec-Verse 2026</a>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                        data-bs-target="#mainNav" aria-label="Close" th:aria-label="#{register.modal.close}"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'retreat'} ? 'active'" th:href="@{/retreat-2026}" th:text="#{nav.glance}">Time Line</a>
                    </li>
                                               <!-- <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/retreat-2024}">Tec-Verse 2024</a></li>
                            <li><a class="dropdown-item" th:href="@{/retreat-2025}">Tec-Verse 2025</a></li> 
                            <li><a class="dropdown-item" th:href="@{/retreat-2026}" th:text="#{contact.title}">Tec-Verse 2026</a></li>
                        </ul> -->


                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'about'} ? 'active'" th:href="@{/about}" th:text="#{nav.about}">About Tec-Verse</a>
                    </li>


                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" th:classappend="${active == 'gallery' or active == 'news'} ? 'active'" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false" th:text="#{nav.explore}">Explore</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/gallery}" th:text="#{nav.gallery}">Gallery</a></li>
                            <li><a class="dropdown-item" th:href="@{/news-updates}" th:text="#{nav.news}">News & Update</a></li>
                            <!-- <li><a class="dropdown-item" th:href="@{/#media-coverage}" th:text="#{footer.link.media}">Media Coverage</a></li> -->
                        </ul>
                    </li>

                    
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${active == 'inquiry'} ? 'active'" th:href="@{/inquiry}" th:text="#{nav.contact}">Contact Us</a>
                    </li>
                </ul>

                <div class="navbar-actions ms-lg-auto d-flex justify-content-end" th:classappend="${attendeeSignedIn} ? ' attendee-navbar-actions'">
                    <div class="mob-clr d-flex justify-content-center navbar-language-switcher notranslate" translate="no" aria-label="Language selector" th:aria-label="#{misc.navbar.languageAria}">
                        <button type="button" class="navbar-language-btn mob-clr notranslate d-inline-flex align-items-center justify-content-center" translate="no" data-language-button="en" lang="en">English</button>
                        <!-- <span class="navbar-language-separator align-items-center justify-content-center" aria-hidden="true">|</span>
                        <button type="button" class="navbar-language-btn mob-clr notranslate d-inline-flex align-items-center justify-content-center" translate="no" data-language-button="ta" lang="ta">&#2980;&#2990;&#3007;&#2996;&#3021;</button> -->
                        <span class="navbar-language-separator align-items-center justify-content-center" aria-hidden="true">|</span>
                        <button type="button" class="navbar-language-btn mob-clr notranslate d-inline-flex align-items-center justify-content-center" translate="no" data-language-button="hi" lang="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368;</button>
                    </div>
                    <th:block th:unless="${attendeeSignedIn}">
                        <button class="navbar-action-btn navbar-action-btn-outline attendee-login-open" type="button" data-attendee-login-open>Login</button>
                        <a class="navbar-action-btn navbar-action-btn-ticket d-inline-flex align-items-center justify-content-center overflow-hidden" th:href="@{/ticket}">Register</a>
                    </th:block>
                    <th:block th:if="${attendeeSignedIn}">
                        <a class="attendee-nav-profile" th:href="@{/dashboard}" aria-label="Attendee profile">
                            <i class="bi bi-person-circle" aria-hidden="true"></i>
                            <span th:text="${attendee.officialName}">Attendee</span>
                        </a>
                        <form method="post" th:action="@{/logout}" class="attendee-nav-logout">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="navbar-action-btn navbar-action-btn-ticket" type="submit">Logout</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</nav>

<dialog class="attendee-login-dialog" data-attendee-login-dialog aria-labelledby="attendeeLoginTitle">
    <button class="attendee-login-close" type="button" data-attendee-login-close aria-label="Close login">&times;</button>
    <div class="attendee-login-brand"><img th:src="@{/images/tecverselogo.png}" alt=""><span>Tec-<em>Verse</em> 2026</span><i aria-hidden="true"></i></div>
    <h2 id="attendeeLoginTitle">Welcome Back!</h2>
    <p class="attendee-login-subtitle">Sign in with the email and password you used to register.</p>
    <p class="attendee-login-error" data-attendee-login-error th:if="${loginError}" th:text="${loginError}" role="alert"></p>
    <form method="post" th:action="@{/login}" data-attendee-login-form>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="attendeeLoginEmail"><i class="bi bi-envelope-fill attendee-field-icon" aria-hidden="true"></i> Registered email <b aria-hidden="true">*</b></label>
        <div class="attendee-input-wrap"><svg class="attendee-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="attendeeLoginEmail" name="email" type="email" autocomplete="email" maxlength="150" placeholder="Enter your registered email" required></div>
        <label for="attendeeLoginPassword"><i class="bi bi-lock-fill attendee-field-icon" aria-hidden="true"></i> Password <b aria-hidden="true">*</b></label>
        <div class="attendee-input-wrap"><svg class="attendee-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="attendeeLoginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="attendee-password-toggle" type="button" data-attendee-password-toggle aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="attendee-captcha-line"><label for="attendeeCaptchaAnswer"><svg class="attendee-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg> Security check <b aria-hidden="true">*</b></label><button type="button" data-attendee-captcha-refresh aria-label="Get a new security question"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.5-3"/></svg> Refresh</button></div>
        <p class="attendee-captcha-question" data-attendee-captcha-question>Loading security check…</p>
        <input type="hidden" name="captchaId" data-attendee-captcha-id>
        <div class="attendee-input-wrap"><svg class="attendee-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2m4 0h2M8 15h2m4 0h2M8 18h2m4 0h2"/></svg><input id="attendeeCaptchaAnswer" name="captchaAnswer" inputmode="numeric" autocomplete="off" placeholder="Enter the answer" required></div>
        <button class="attendee-login-submit" type="submit">Login <span aria-hidden="true">→</span></button>
    </form>
    <p class="attendee-login-register">New to Tec-Verse? <a th:href="@{/ticket}">Register</a></p>
</dialog>
<script th:src="@{/js/attendee-login-modal.js}" defer></script>

</div>

</body>
</html>
