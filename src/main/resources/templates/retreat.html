<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${retreat.badge()} + ' | Tec-verse'">Tec-Verse 2026</title>
    <link rel="icon" type="image/png" th:href="@{/images/tecverselogo.png}">


    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* ================================================================
           TEC-VERSE 2026 — ROADMAP · glass + road, snake grid, scroll-driven
           ================================================================ */
        .tv-page{
            --ink:#0e2038; --muted:#5c7290; --card:rgba(255,255,255,.55); --card-border:rgba(255,255,255,.65);
            --d1-a:#1769e0; --d1-b:#19c2d8; --d2-a:#7357df; --d2-b:#d857b0;
            position:relative; box-sizing:border-box; overflow:hidden; min-height:100vh; padding:120px 18px 16px; color:var(--ink);
            background:
              radial-gradient(circle at 8% 6%, rgba(25,194,216,.18), transparent 30%),
              radial-gradient(circle at 94% 16%, rgba(115,87,223,.16), transparent 33%),
              radial-gradient(circle at 18% 88%, rgba(216,87,176,.09), transparent 30%),
              linear-gradient(180deg,#edf3fa 0%,#f7f8fc 48%,#f0f4fa 100%);
            font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        }
        .tv-page * { box-sizing:border-box; }
        .tv-shell{ position:relative; z-index:1; width:min(1200px,100%); margin:auto; }

        /* ---------- head ---------- */
        .tv-head{
            position:relative; isolation:isolate; overflow:hidden;
            width:100vw; min-height:220px; margin:0 calc(50% - 50vw) 34px; padding:36px 24px;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            border:0; border-radius:0; text-align:center;
            background-image:
              linear-gradient(180deg,rgba(0,0,0,.56),rgba(0,0,0,.42)),
              linear-gradient(90deg,rgba(7,24,47,.64),rgba(7,24,47,.12),rgba(7,24,47,.7)),
              var(--retreat-banner-image);
            background-position:center 52%; background-size:cover; background-repeat:no-repeat;
            box-shadow:0 18px 42px rgba(10,28,52,.18);
        }
        .tv-kicker{ display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border:1px solid rgba(255,255,255,.42); border-radius:999px; background:rgba(255,255,255,.14); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); font-family:"Space Grotesk",sans-serif; font-size:.72rem; font-weight:600; letter-spacing:.14em; color:#fff; }
        .tv-kicker::before{ content:""; width:6px; height:6px; border-radius:50%; background:linear-gradient(135deg,var(--d1-b),var(--d2-a)); }
        .tv-head h1{ margin:10px 0 6px; font-family:"Space Grotesk",sans-serif; font-size:clamp(2rem,4vw,3.3rem); font-weight:700; letter-spacing:-.03em; line-height:1; color:#fff; text-shadow:0 4px 22px rgba(0,0,0,.38); }
        .tv-head .tv-sub{ margin:0; color:rgba(255,255,255,.92); font-size:1rem; font-weight:500; text-shadow:0 2px 12px rgba(0,0,0,.42); }
        .tv-mantra{ display:flex; justify-content:center; gap:12px; margin-top:20px; font-size:.72rem; font-weight:600; letter-spacing:.1em; color:rgba(255,255,255,.9); text-shadow:0 2px 10px rgba(0,0,0,.4); }
        .tv-mantra span:not(:last-child)::after{ content:"·"; margin-left:12px; color:#25a9cf; }

        /* ---------- day divider ---------- */
        .tv-day-head{ position:sticky; top:14px; z-index:20; display:flex; align-items:center; gap:14px; width:fit-content; margin:0 auto 46px; padding:12px 22px; border-radius:999px; background:rgba(255,255,255,.68); border:1px solid var(--card-border); box-shadow:0 12px 34px rgba(20,50,90,.10); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
        .tv-day-head--d2{ margin-top:24px; }
        .tv-day-num{ display:grid; place-items:center; width:38px; height:38px; border-radius:50%; color:#fff; font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:.9rem; background:linear-gradient(145deg,var(--d1-a),var(--d1-b)); box-shadow:0 8px 20px rgba(23,105,224,.3); }
        .tv-day-head--d2 .tv-day-num{ background:linear-gradient(145deg,var(--d2-a),var(--d2-b)); box-shadow:0 8px 20px rgba(115,87,223,.3); }
        .tv-day-head strong{ display:block; font-family:"Space Grotesk",sans-serif; font-size:.95rem; font-weight:700; }
        .tv-day-head > div > span{ display:block; margin-top:1px; color:var(--muted); font-size:.72rem; font-weight:500; }
        .tv-day-switch{ display:flex; width:fit-content; max-width:100%; gap:6px; margin:0 auto 28px; padding:6px; border:1px solid rgba(146,170,199,.28); border-radius:999px; background:rgba(255,255,255,.72); box-shadow:0 12px 30px rgba(20,50,90,.08); backdrop-filter:blur(16px); }
        .tv-day-switch button{ min-width:112px; padding:10px 18px; border:0; border-radius:999px; background:transparent; color:var(--muted); font:600 .82rem "Space Grotesk",sans-serif; cursor:pointer; transition:color .2s ease, background .25s ease, box-shadow .25s ease, transform .25s ease; }
        .tv-day-switch button:hover{ color:var(--ink); }
        .tv-day-switch button[aria-selected="true"]{ color:#fff; background:linear-gradient(135deg,var(--d1-a),var(--d1-b)); box-shadow:0 7px 18px rgba(23,105,224,.24); }
        .tv-day-switch button[data-day-index="1"][aria-selected="true"]{ background:linear-gradient(135deg,var(--d2-a),var(--d2-b)); box-shadow:0 7px 18px rgba(115,87,223,.24); }
        .tv-day-panel[hidden]{ display:none; }
        .tv-day-panel{ animation:tv-panel-in .3s ease both; }
        .tv-day-rule{ width:96vw; margin:0 calc(50% - 48vw) 30px; border:0; border-top:1px solid #dbe4ee; opacity:1; }
        @keyframes tv-panel-in{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* ---------- road + snake grid ---------- */
        .tv-road{ position:relative; padding:10px 0 30px; }
        .tv-road-svg{ position:absolute; inset:0; z-index:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
        .tv-road-base, .tv-road-fill, .tv-road-center{ fill:none; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
        .tv-road-base{ stroke:rgba(255,255,255,.9); stroke-width:16; filter:drop-shadow(0 10px 20px rgba(30,60,100,.10)); }
        .tv-road-base-in{ fill:none; stroke:rgba(146,170,199,.30); stroke-width:16; stroke-dasharray:1 13; stroke-linecap:round; }
        .tv-road-fill{ stroke:url(#d1Grad); stroke-width:5.5; stroke-linecap:round; transition:stroke-dashoffset .08s linear; }
        .tv-road--d2 .tv-road-fill{ stroke:url(#d2Grad); }
        .tv-road-dot{ fill:#fff; stroke:rgba(146,170,199,.55); stroke-width:2; }
        .tv-road-dot.is-lit{ stroke:var(--d1-a); fill:var(--d1-b); }
        .tv-road--d2 .tv-road-dot.is-lit{ stroke:var(--d2-a); fill:var(--d2-b); }

        .tv-grid{ position:relative; z-index:2; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:30px 30px; }
        .tv-node{ position:relative; display:flex; flex-direction:column; align-items:center; perspective:1400px; }

        .tv-node-dot{ position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:#fff; border:4px solid rgba(146,170,199,.5); z-index:5; transition:border-color .4s ease, box-shadow .4s ease, transform .4s ease; }
        .tv-node.is-active .tv-node-dot{ border-color:var(--d1-a); box-shadow:0 0 0 5px rgba(23,105,224,.14); transform:translateX(-50%) scale(1.12); }
        .tv-road--d2 .tv-node.is-active .tv-node-dot{ border-color:var(--d2-a); box-shadow:0 0 0 5px rgba(115,87,223,.14); }

        .tv-card{
            position:relative; z-index:2; width:100%; padding:22px 16px 18px; border-radius:18px; text-align:center;
            background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.3));
            border:1px solid var(--card-border); box-shadow:0 16px 40px rgba(20,50,90,.08);
            backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
            opacity:.55; transform:translateY(10px) scale(.97);
            transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease, border-color .5s ease;
        }
        .tv-node.is-active .tv-card{ opacity:1; transform:translateY(-3px) scale(1.015); border-color:rgba(23,105,224,.55); background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(239,248,255,.88)); box-shadow:0 18px 38px rgba(20,50,90,.14), 0 0 0 1px rgba(23,105,224,.12) inset, 0 0 26px rgba(25,194,216,.22); }
        .tv-node.is-active .tv-card::after{ position:absolute; inset:0; border-radius:inherit; pointer-events:none; content:""; background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.46) 48%,transparent 72%); opacity:.7; }
        .tv-road--d2 .tv-node.is-active .tv-card{ border-color:rgba(115,87,223,.5); background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(248,241,255,.88)); box-shadow:0 18px 38px rgba(90,50,140,.14), 0 0 0 1px rgba(115,87,223,.12) inset, 0 0 26px rgba(216,87,176,.2); }

        .tv-body{ position:relative; z-index:1; }
        .tv-node time{ display:block; color:var(--d1-a); font-family:"Space Grotesk",sans-serif; font-size:.63rem; font-weight:600; letter-spacing:.02em; }
        .tv-road--d2 .tv-node time{ color:var(--d2-a); }
        .tv-node h3{ margin:5px 0 0; font-size:.86rem; line-height:1.28; font-weight:700; color:var(--ink); }
        .tv-node p{ margin:3px 0 0; color:var(--muted); font-size:.66rem; font-weight:500; }

        .tv-finish{ display:flex; align-items:center; justify-content:center; gap:12px; margin:56px auto 0; padding:14px 26px; width:fit-content; border-radius:999px; background:rgba(255,255,255,.6); border:1px solid var(--card-border); backdrop-filter:blur(16px); box-shadow:0 12px 30px rgba(20,50,90,.1); }
        .tv-finish strong{ font-family:"Space Grotesk",sans-serif; font-size:.85rem; letter-spacing:.04em; }
        .tv-finish span{ color:var(--muted); font-size:.72rem; }

        @media (prefers-reduced-motion:reduce){ .tv-card{ transition:none!important; } }

        @media (max-width:900px){ .tv-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 18px; } }
        @media (max-width:560px){
            .tv-page{ padding:96px 14px 16px; }
            .tv-head{ min-height:190px; padding:30px 18px; }
            .tv-head h1{ font-size:2.2rem; }
            .tv-day-head{ position:static; margin-bottom:30px; }
            .tv-day-head--d2{ margin-top:16px; }
            .tv-grid{ grid-template-columns:1fr; gap:16px; }
            .tv-card{ padding:18px 15px; }
        }
    </style>
</head>
<body class="retreat-page" th:classappend="' retreat-page--' + ${retreat.accent()}">
<div th:replace="~{fragments/navbar :: navbar('retreat')}"></div>

<main>
<section class="tv-page" aria-labelledby="roadmap-title">
<div class="tv-shell">

    <header class="tv-head" th:style="|--retreat-banner-image: url('@{/images/retreat-banner.png}')|">
        <!-- <span class="tv-kicker">AT A GLANCE</span> -->
        <h1 id="roadmap-title" th:text="#{retreat.roadmap.title}">Event Roadmap</h1>
        <p class="tv-sub" th:text="#{retreat.roadmap.subtitle}">TEC-VERSE 2026 · 26–27 November · Chennai Trade Centre</p>
        <div class="tv-mantra"><span th:text="#{retreat.mantra.connect}">Connect</span><span th:text="#{retreat.mantra.collaborate}">Collaborate</span><span th:text="#{retreat.mantra.innovate}">Innovate</span></div>
    </header>

    <div th:if="${#lists.isEmpty(conferenceScheduleDays)}" class="tv-day-head">
        <div><strong th:text="#{retreat.schedule.empty.title}">Schedule coming soon</strong><span th:text="#{retreat.schedule.empty.description}">Event sessions will appear here when published.</span></div>
    </div>

            <div class="tv-day-switch" role="tablist" th:aria-label="#{retreat.schedule.chooseDay}" th:if="${!#lists.isEmpty(conferenceScheduleDays)}">
                <button th:each="day, dayStat : ${conferenceScheduleDays}" type="button" role="tab"
                        th:id="|day-tab-${dayStat.index}|" th:aria-controls="|day-panel-${dayStat.index}|"
                        th:aria-selected="${dayStat.index == 0}" th:tabindex="${dayStat.index == 0 ? 0 : -1}"
                        th:data-day-index="${dayStat.index}" th:text="#{retreat.schedule.day(${day.dayNumber})}">Day 1</button>
            </div>

            <th:block th:each="day, dayStat : ${conferenceScheduleDays}">
              <section class="tv-day-panel" role="tabpanel" tabindex="0"
                       th:id="|day-panel-${dayStat.index}|" th:aria-labelledby="|day-tab-${dayStat.index}|"
                       th:data-day-panel="${dayStat.index}" th:hidden="${dayStat.index != 0}">
        <hr class="tv-day-rule" th:if="${dayStat.index == 0}" aria-hidden="true">
        <div class="tv-day-head" th:classappend="${dayStat.index > 0} ? ' tv-day-head--d2' : ''">
            <span class="tv-day-num" th:text="${#numbers.formatInteger(day.dayNumber, 2)}">01</span>
            <div>
                <strong><span th:text="#{retreat.schedule.day(${day.dayNumber})}">Day 01</span><span th:if="${!#strings.isEmpty(day.dateLabel)}"> · </span><span th:text="${#strings.replace(day.dateLabel, 'November', #messages.msg('retreat.schedule.month.november'))}">26 November</span></strong>
                <span th:text="#{retreat.schedule.sessions(${#lists.size(day.sessions)})}">12 scheduled sessions</span>
            </div>
        </div>

        <div class="tv-road" th:classappend="${dayStat.index > 0} ? ' tv-road--d2' : ' tv-road--d1'" data-road>
            <svg class="tv-road-svg" aria-hidden="true" focusable="false" preserveAspectRatio="none">
                <defs>
                    <linearGradient th:id="|roadGradient${day.dayNumber}|" x1="0" y1="0" x2="1" y2="1">
                        <th:block th:if="${dayStat.index == 0}">
                            <stop offset="0%" stop-color="#1769e0"/><stop offset="100%" stop-color="#19c2d8"/>
                        </th:block>
                        <th:block th:unless="${dayStat.index == 0}">
                            <stop offset="0%" stop-color="#7357df"/><stop offset="100%" stop-color="#d857b0"/>
                        </th:block>
                    </linearGradient>
                </defs>
                <path class="tv-road-base"></path>
                <path class="tv-road-base-in"></path>
                <path class="tv-road-fill" data-fill th:style="|stroke:url(#roadGradient${day.dayNumber})|"></path>
                <g data-dots></g>
            </svg>

            <div class="tv-grid" data-grid>
                <div class="tv-node" data-node th:each="scheduleItem, sessionStat : ${day.sessions}">
                    <div class="tv-node-dot"></div>
                    <div class="tv-card">
                        <div class="tv-body">
                            <time th:text="${scheduleItem.timeLabel}">09:00 – 10:00 AM</time>
                            <h3 th:text="${#messages.msgOrNull('schedule.item.' + scheduleItem.title) ?: scheduleItem.title}">Registration</h3>
                            <p th:if="${scheduleItem.highlighted}" th:text="${#messages.msgOrNull('schedule.description.' + scheduleItem.description) ?: scheduleItem.description}">Featured session</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
              </section>
    </th:block>



</div>
</section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
<script>
(function(){
  const roads = [...document.querySelectorAll('[data-road]')];
  if(!roads.length) return;

  const dayTabs = [...document.querySelectorAll('.tv-day-switch [role="tab"]')];
  const dayPanels = [...document.querySelectorAll('[data-day-panel]')];
  function activateDay(index, moveFocus){
    dayTabs.forEach((tab, i) => {
      const selected = i === index;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      dayPanels[i].hidden = !selected;
    });
    if(moveFocus) dayTabs[index].focus();
    requestAnimationFrame(() => state.forEach(s => { if(!s.road.closest('[hidden]')) redrawRoad(s); }));
  }
  dayTabs.forEach((tab, index) => {
    tab.addEventListener('click', () => activateDay(index, false));
    tab.addEventListener('keydown', event => {
      let next = index;
      if(event.key === 'ArrowRight') next = (index + 1) % dayTabs.length;
      else if(event.key === 'ArrowLeft') next = (index - 1 + dayTabs.length) % dayTabs.length;
      else if(event.key === 'Home') next = 0;
      else if(event.key === 'End') next = dayTabs.length - 1;
      else return;
      event.preventDefault();
      activateDay(next, true);
    });
  });

  function cols(){
    if(matchMedia('(max-width:560px)').matches) return 1;
    if(matchMedia('(max-width:900px)').matches) return 2;
    return 3;
  }

  /* lay nodes into a snake pattern: row 0 L→R, row 1 R→L, etc. */
  function layout(grid){
    const n = cols();
    const nodes = [...grid.querySelectorAll('[data-node]')];
    nodes.forEach((node, i) => {
      const row = Math.floor(i / n);
      const posInRow = i % n;
      const col = (row % 2 === 0) ? posInRow + 1 : n - posInRow;
      node.style.gridColumn = String(col);
      node.style.gridRow = String(row + 1);
    });
  }

  function roadPoints(road){
    const rr = road.getBoundingClientRect();
    return [...road.querySelectorAll('[data-node]')].map(node => {
      const dot = node.querySelector('.tv-node-dot');
      const r = dot.getBoundingClientRect();
      return { x: r.left + r.width / 2 - rr.left, y: r.top + r.height / 2 - rr.top, node };
    });
  }

  function buildPath(points){
    if(!points.length) return '';
    const mobile = matchMedia('(max-width:560px)').matches;
    let d = `M ${points[0].x} ${points[0].y}`;
    for(let i = 1; i < points.length; i++){
      const a = points[i - 1], b = points[i];
      if(mobile){
        const mid = (a.y + b.y) / 2;
        d += ` C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y}`;
        continue;
      }
      const sameRow = Math.abs(a.y - b.y) < 6;
      if(sameRow){
        d += ` L ${b.x} ${b.y}`;
      } else {
        const bend = Math.max(28, Math.min(60, Math.abs(b.y - a.y) * .5));
        const dir = b.x >= a.x ? 1 : -1;
        d += ` C ${a.x + dir * bend} ${a.y}, ${b.x + dir * bend} ${b.y}, ${b.x} ${b.y}`;
      }
    }
    return d;
  }

  const state = roads.map(road => ({
    road,
    grid: road.querySelector('[data-grid]'),
    svg: road.querySelector('.tv-road-svg'),
    base: road.querySelector('.tv-road-base'),
    baseIn: road.querySelector('.tv-road-base-in'),
    fill: road.querySelector('[data-fill]'),
    dotsG: road.querySelector('[data-dots]'),
    points: [],
    length: 0
  }));

  function redrawRoad(s){
      if(s.road.closest('[hidden]')) return;
      layout(s.grid);
      requestAnimationFrame(() => {
        const w = s.road.clientWidth, h = s.road.scrollHeight;
        s.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        s.svg.setAttribute('width', w);
        s.svg.setAttribute('height', h);
        s.points = roadPoints(s.road);
        const d = buildPath(s.points);
        s.base.setAttribute('d', d);
        s.baseIn.setAttribute('d', d);
        s.fill.setAttribute('d', d);
        s.length = s.fill.getTotalLength ? s.fill.getTotalLength() : 0;
        s.fill.style.strokeDasharray = s.length;
        s.fill.style.strokeDashoffset = s.length;

        s.dotsG.innerHTML = '';
        s.points.forEach(p => {
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('class', 'tv-road-dot');
          c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 5);
          s.dotsG.appendChild(c);
          p.dotEl = c;
        });
        updateProgress(s);
      });
  }

  function redraw(){
    state.forEach(redrawRoad);
  }

  /* scroll-driven: reveal the road up to the point level with viewport centre,
     and mark every node above that line as active/lit */
  function updateProgress(s){
    if(!s.points.length || !s.length) return;
    const vh = window.innerHeight;
    const centerY = vh * 0.55;
    const roadTop = s.road.getBoundingClientRect().top;

    let activeCount = 0;
    s.points.forEach(p => {
      const pageY = roadTop + p.y;
      const passed = pageY <= centerY;
      p.node.classList.toggle('is-active', passed);
      if(p.dotEl) p.dotEl.classList.toggle('is-lit', passed);
      if(passed) activeCount++;
    });

    let frac;
    if(activeCount === 0) frac = 0;
    else if(activeCount >= s.points.length) frac = 1;
    else {
      const cur = s.points[activeCount - 1], next = s.points[activeCount];
      const curPageY = roadTop + cur.y, nextPageY = roadTop + next.y;
      const between = nextPageY === curPageY ? 1 : (centerY - curPageY) / (nextPageY - curPageY);
      frac = ((activeCount - 1) + Math.max(0, Math.min(1, between))) / (s.points.length - 1);
    }
    s.fill.style.strokeDashoffset = String(s.length * (1 - Math.max(0, Math.min(1, frac))));
  }

  function onScroll(){ state.forEach(updateProgress); }

  let rT;
  addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(redraw, 100); }, { passive:true });
  addEventListener('scroll', onScroll, { passive:true });
  addEventListener('load', redraw);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  redraw();
  setTimeout(redraw, 300); /* catch late image sizing */
})();
</script>
</body>
