<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendee Login | Tec-Verse 2026</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071b38,#45228b);font-family:system-ui,sans-serif}.login-card{width:min(460px,92vw);background:#fff;border-radius:20px;padding:2rem;box-shadow:0 18px 50px #06142a55;color:#142542}.login-card img{width:64px}.login-card label{display:block;margin:.9rem 0 .3rem;font-weight:650}.login-card input{width:100%;padding:.8rem;border:1px solid #cbd4e2;border-radius:8px}.login-card button{width:100%;margin-top:1.1rem;padding:.85rem;border:0;border-radius:8px;background:#5127b8;color:#fff;font-weight:700}.login-card a{color:#5127b8}.error{padding:.7rem;background:#fff0f0;color:#9a2525;border-radius:7px}.login-card :focus-visible{outline:3px solid #7ea7ff;outline-offset:2px}</style><link rel="stylesheet" th:href="@{/css/attendee-portal.css}"></head><body><main class="login-card"><img th:src="@{/images/tecverselogo.png}" alt="Tec-Verse"><p>Log in to manage your registration and thematic sessions.</p><p class="error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="email">Registered Email Address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="150" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><label for="captchaAnswer">CAPTCHA: <span th:text="${captcha.question}"></span></label><input type="hidden" name="captchaId" th:value="${captcha.id}"><input id="captchaAnswer" name="captchaAnswer" inputmode="numeric" autocomplete="off" required><button type="submit">Login</button></form><p><a th:href="@{/auth}">Back to Login / Register</a> · <a th:href="@{/registration}">Register</a></p><p>Password recovery is not available online. Contact the event team for help.</p></main></body></html>
