<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Admin | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('faqs')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('FAQ Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin}"><i class="bi bi-arrow-left"></i> Dashboard</a>
            <h1 class="h3 mt-2 mb-1">FAQ Management</h1>
            <p class="text-muted mb-0">Manage questions and answers displayed on public pages.</p>
        </div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/faqs/new(section=${activeSection})}">
            <i class="bi bi-plus-lg me-1"></i> Add FAQ
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Saved.</div>

    <ul class="nav nav-pills mb-3 gap-2">
        <li class="nav-item" th:each="section : ${faqSections}">
            <a th:classappend="${activeSection == section.key} ? ' active'"
               class="nav-link"
               th:href="@{/admin/faqs(section=${section.key})}"
               th:text="${section.value}">Home FAQ</a>
        </li>
    </ul>

    <section class="table-card bg-white overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 table-hover">
                <thead class="table-light">
                <tr>
                    <th style="width: 38%">Question</th>
                    <th>Answer</th>
                    <th>Order</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(faqs)}">
                    <td colspan="5" class="py-5 text-center text-muted" th:text="${'No FAQs saved for ' + sectionLabel + ' yet.'}">No FAQs saved yet.</td>
                </tr>
                <tr th:each="item : ${faqs}">
                    <td class="fw-semibold" th:text="${item.question}">Question</td>
                    <td class="text-muted small" th:text="${item.answer}">Answer</td>
                    <td th:text="${item.displayOrder}">0</td>
                    <td>
                        <span th:if="${item.active}" class="badge text-bg-success rounded-pill">Active</span>
                        <span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Inactive</span>
                    </td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/faqs/{id}/edit(id=${item.id})}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/faqs/{id}/toggle(id=${item.id})}" method="post">
                                <button class="btn btn-sm btn-outline-secondary" type="submit">
                                    <i th:class="${item.active} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/faqs/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this FAQ?');">
                                <input type="hidden" name="section" th:value="${activeSection}">
                                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
