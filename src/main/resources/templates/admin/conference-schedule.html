<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Schedule Admin | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('schedule')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Conference Schedule')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin}"><i class="bi bi-arrow-left"></i> Dashboard</a>
            <h1 class="h3 mt-2 mb-0">Conference Schedule</h1>
        </div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/conference-schedule/new}"><i class="bi bi-plus-lg me-1"></i> Add Schedule Item</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Saved.</div>

    <section class="table-card bg-white overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 table-hover">
                <thead class="table-light">
                <tr>
                    <th>Day</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Title</th>
                    <th>Order</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(scheduleItems)}">
                    <td colspan="7" class="py-5 text-center text-muted">No schedule items saved yet.</td>
                </tr>
                <tr th:each="item : ${scheduleItems}">
                    <td class="fw-semibold" th:text="${item.dayTitle}">Day 01</td>
                    <td th:text="${item.dateLabel}">26 November 2026</td>
                    <td th:text="${item.timeLabel}">09:00 AM - 10:00 AM</td>
                    <td>
                        <span th:text="${item.sessionTitle}">Registration</span>
                        <span th:if="${item.highlighted}" class="badge text-bg-info ms-2 rounded-pill">Highlighted</span>
                    </td>
                    <td th:text="${item.displayOrder}">10</td>
                    <td>
                        <span th:if="${item.active}" class="badge text-bg-success rounded-pill">Published</span>
                        <span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Hidden</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/conference-schedule/{id}/edit(id=${item.id})}" title="Edit schedule item" aria-label="Edit schedule item">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <form class="d-inline" th:action="@{/admin/conference-schedule/{id}/delete(id=${item.id})}" method="post"
                              onsubmit="return confirm('Delete this schedule item?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Delete schedule item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
 </div>
 </div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
