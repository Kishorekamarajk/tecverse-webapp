<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'edit'} ? 'Edit Chief Guest | Tec-Verse' : 'Add Chief Guest | Tec-Verse'">Chief Guest | Tec-Verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('chief-guests')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Chief Guest Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4">
        <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/chief-guests}"><i class="bi bi-arrow-left"></i> Chief Guests</a>
        <h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit'} ? 'Edit Chief Guest' : 'Add Chief Guest'">Add Chief Guest</h1>
    </div>
    <section class="card form-card overflow-hidden"><div class="card-body p-4">
        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/chief-guests/{id}(id=${chiefGuestId})} : @{/admin/chief-guests}"
              th:object="${chiefGuestForm}" method="post" enctype="multipart/form-data">
            <div class="alert alert-warning" role="alert" th:if="${uploadErrorMessage != null}" th:text="${uploadErrorMessage}"></div>
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="name">Full Name *</label>
                    <input id="name" class="form-control form-control-lg" th:field="*{name}" maxlength="150" required placeholder="Dr. V. Narayanan">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="designation">Designation *</label>
                    <input id="designation" class="form-control form-control-lg" th:field="*{designation}" maxlength="180" required placeholder="Chairman">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></div>
                </div>
                <div class="col-md-7">
                    <label class="form-label fw-semibold" for="organization">Organization *</label>
                    <input id="organization" class="form-control form-control-lg" th:field="*{organization}" maxlength="180" required placeholder="ISRO">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('organization')}" th:errors="*{organization}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold" for="displayOrder">Display Order</label>
                    <input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
                </div>
                <div class="col-md-7">
                    <label class="form-label fw-semibold" for="imageFile" th:text="${mode == 'edit'} ? 'Upload New Photo' : 'Upload Photo *'">Upload Photo *</label>
                    <input id="imageFile" name="imageFile" type="file" class="form-control form-control-lg"
                           accept="image/png,image/jpeg" data-max-file-bytes="1048576" th:required="${mode != 'edit'}">
                    <div class="form-text">JPG or PNG, up to 1 MB. The app removes the background locally and applies #063264. Leave empty to keep the current photo when editing.</div>
                    <div class="mt-2" th:if="${mode == 'edit' and currentImageUrl != null and !currentImageUrl.isBlank()}">
                        <img th:src="@{${currentImageUrl}}" alt="Current chief guest photo" class="rounded" style="max-width: 180px; max-height: 180px; object-fit: cover;">
                    </div>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold" for="accentColor">Card Accent Color</label>
                    <input id="accentColor" type="color" class="form-control form-control-color" th:field="*{accentColor}" title="Choose card accent color">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}"></div>
                </div>
            </div>
            <div class="form-check form-switch my-4">
                <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                <label class="form-check-label fw-semibold" for="active">Show this guest on the public home page</label>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save Chief Guest</button>
                <a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/chief-guests}">Cancel</a>
            </div>
        </form>
    </div></section>
</main>
</div>
</div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js" integrity="sha384-DIFfDxcYkhbAXYdxOYFZshXsis24zK4HtbU7qI30u9/eP7JtiRIGuOaLsoYL5QTs" crossorigin="anonymous"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
