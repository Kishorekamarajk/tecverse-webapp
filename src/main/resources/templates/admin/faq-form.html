<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'edit'} ? 'Edit FAQ | Tec-verse' : 'Add FAQ | Tec-verse'">FAQ Admin | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('faqs')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('FAQ Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/faqs(section=${faqItemForm.pageKey})}">
        <i class="bi bi-arrow-left"></i> Back to FAQs
    </a>

    <section class="admin-form-card mt-3 card">
        <div class="admin-card-title mb-4 d-flex align-items-center">
            <i class="bi bi-question-circle"></i>
            <h1 th:text="${mode == 'edit'} ? 'Edit FAQ' : 'New FAQ'">New FAQ</h1>
        </div>

        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/faqs/{id}(id=${faqId})} : @{/admin/faqs}"
              th:object="${faqItemForm}"
              method="post"
              class="admin-form-grid row">
            <div class="form-field d-flex flex-column gap-2 col-12 col-md-6">
                <label for="pageKey">FAQ Section *</label>
                <select class="form-select" id="pageKey" th:field="*{pageKey}" required>
                    <option th:each="section : ${faqSections}" th:value="${section.key}" th:text="${section.value}">Home FAQ</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('pageKey')}" th:errors="*{pageKey}"></div>
            </div>

            <div class="form-field d-flex flex-column gap-2 col-12 col-md-6">
                <label for="displayOrder">Display Order</label>
                <input class="form-control" id="displayOrder" type="number" min="0" th:field="*{displayOrder}">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
            </div>

            <div class="form-field full d-flex flex-column gap-2 col-12">
                <label for="question">Question *</label>
                <input class="form-control" id="question" type="text" th:field="*{question}" maxlength="300" required placeholder="Enter FAQ question">
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('question')}" th:errors="*{question}"></div>
            </div>

            <div class="form-field full d-flex flex-column gap-2 col-12">
                <label for="answer">Answer *</label>
                <textarea class="form-control" id="answer" rows="6" th:field="*{answer}" maxlength="10000" required placeholder="Enter FAQ answer"></textarea>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}"></div>
            </div>

            <label class="admin-check full col-12 d-inline-flex align-items-center">
                <input class="form-check-input mt-0" type="checkbox" th:field="*{active}">
                <span>Show this FAQ on the public page</span>
            </label>

            <div class="form-actions full col-12 d-flex justify-content-end">
                <a class="btn btn-outline-secondary" th:href="@{/admin/faqs(section=${faqItemForm.pageKey})}">Cancel</a>
                <button class="btn btn-success fw-bold" type="submit">
                    <i class="bi bi-check2 me-1"></i> Save FAQ
                </button>
            </div>
        </form>
    </section>
</main>
</div>
</div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
