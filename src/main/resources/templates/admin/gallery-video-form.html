<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Video | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('gallery')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Gallery Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4"><a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/gallery(tab='videos')}"><i class="bi bi-arrow-left"></i> Gallery</a><h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit'} ? 'Edit Gallery Video' : 'Add Gallery Video'">Add Gallery Video</h1></div>
    <section class="card form-card overflow-hidden"><div class="card-body p-4">
        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/gallery/videos/{id}(id=${videoId})} : @{/admin/gallery/videos}" th:object="${galleryVideoForm}" method="post" enctype="multipart/form-data">
            <div class="mb-3"><label class="form-label fw-semibold" for="title">Title</label><input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="180" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="description">Description / Category</label><textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="500" required></textarea><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div></div>
            <div class="row g-3">
                <div class="col-md-7"><label class="form-label fw-semibold" for="videoFile">Upload Video</label><input id="videoFile" name="videoFile" type="file" class="form-control form-control-lg" accept="video/mp4,video/webm,video/ogg,video/quicktime,.mp4,.webm,.ogg,.mov" data-max-file-bytes="1048576" data-file-or-path="#videoUrl"><div class="form-text">MP4, WEBM, OGG, or MOV; maximum 1 MB.</div></div>
                <div class="col-md-5"><label class="form-label fw-semibold" for="displayOrder">Display Order</label><input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div></div>
            </div>
            <div class="mt-3"><label class="form-label fw-semibold" for="videoUrl">YouTube video link / Existing Path</label><input id="videoUrl" class="form-control form-control-lg" th:field="*{videoUrl}" maxlength="500" pattern="(?:https?://\S+|/(?!/)\S*)" placeholder="https://www.youtube.com/watch?v=..."><div class="form-text">Paste a YouTube video link or upload a video file. YouTube thumbnails are filled automatically unless you provide one.</div><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></div></div>
            <div class="row g-3 mt-1">
                <div class="col-12"><label class="form-label fw-semibold" for="thumbnailFile">Thumbnail Image</label><input id="thumbnailFile" name="thumbnailFile" type="file" class="form-control form-control-lg" accept="image/png,image/jpeg,image/webp,image/gif" data-max-file-bytes="1048576"><div class="form-text">JPG, PNG, WEBP, or GIF; maximum 1 MB.</div></div>
            </div>
            <div class="form-check form-switch my-4"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label fw-semibold" for="active">Active on public Gallery</label></div>
            <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save</button><a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/gallery(tab='videos')}">Cancel</a></div>
        </form>
    </div></section>
</main>
 </div>
 </div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
