<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tec-verse</title>
    <link rel="icon" type="image/png" th:href="@{/images/tecverselogo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
    <script defer th:src="@{/js/jquery-form-validation.js}"></script>
    <style>
        body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 15%, rgba(38, 184, 190, .3), transparent 30%), linear-gradient(135deg, #062f50, #087d89); font-family: Inter, system-ui, sans-serif; }
        .login-card { width: min(92vw, 450px); border: 0; border-radius: 24px; box-shadow: 0 28px 70px rgba(0, 20, 35, .35); overflow: hidden; }
        .login-card::before { content: ''; display: block; height: 5px; background: linear-gradient(90deg, #ff6b1a, #ffc107, #00a994); }
        .brand-mark { width: 62px; height: 62px; object-fit: contain; }
        .login-kicker { color: #008f83; font-size: .73rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .btn-admin { background: #ff6b1a; border-color: #ff6b1a; font-weight: 800; box-shadow: 0 9px 18px rgba(255, 107, 26, .2); }
        .btn-admin:hover, .btn-admin:focus { background: #e95609; border-color: #e95609; }
    </style>
</head>
<body>
<main class="card login-card">
    <div class="card-body p-4 p-sm-5">
        <div class="mb-4 text-center">
            <img class="brand-mark mb-3" th:src="@{/images/tecverselogo.png}" alt="Tec-verse logo">
            <div class="login-kicker mb-2">Secure workspace</div>
            <h1 class="h4 fw-black mb-1">Admin Login</h1>
            <p class="text-muted mb-0">Manage News &amp; Updates</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>

        <form id="adminLoginForm" th:action="@{/adminportal}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="username">Username</label>
                <input id="username" name="username" type="text" class="form-control form-control-lg"
                       value="" autocomplete="off" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg"
                       value="" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary btn-admin btn-lg w-100" type="submit">Login</button>
        </form>
    </div>
</main>
</body>
</html>
