<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tec-verse</title>
    <link rel="icon" type="image/png" th:href="@{/images/tecverselogo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script defer src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js" integrity="sha384-DIFfDxcYkhbAXYdxOYFZshXsis24zK4HtbU7qI30u9/eP7JtiRIGuOaLsoYL5QTs" crossorigin="anonymous"></script>
    <script defer th:src="@{/js/jquery-form-validation.js}"></script>
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 20px 14px; background: radial-gradient(circle at 15% 15%, rgba(38, 184, 190, .3), transparent 30%), linear-gradient(135deg, #062f50, #087d89); font-family: Inter, system-ui, sans-serif; }
        .login-card { width: min(92vw, 420px); border: 0; border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 20, 35, .28); overflow: hidden; }
        .login-card::before { content: ''; display: block; height: 4px; background: linear-gradient(90deg, #ff6b1a, #ffc107, #00a994); }
        .login-card .card-body { padding: 24px 30px 28px !important; }
        .brand-mark { width: 48px; height: 48px; object-fit: contain; }
        .login-kicker { color: #008f83; font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .btn-admin { background: #ff6b1a; border-color: #ff6b1a; font-weight: 800; box-shadow: 0 9px 18px rgba(255, 107, 26, .2); }
        .btn-admin:hover, .btn-admin:focus { background: #e95609; border-color: #e95609; }
        .captcha-challenge { display: inline-block; padding: .65rem 1rem; border-radius: .6rem; background: #092c62; color: #fff; font: 800 1.15rem ui-monospace, monospace; letter-spacing: .2em; user-select: none; }
        #adminLoginForm .mb-3, #adminLoginForm .mb-4 { margin-bottom: .9rem !important; }
        #adminLoginForm .form-label { margin-bottom: .4rem; color: #183456; }
        #adminLoginForm .form-control { min-height: 46px; border-radius: 11px; border-color: #d5e1ee; background: #fbfdff; padding-inline: 13px; }
        #adminLoginForm .form-control:focus { border-color: #20aa9b; box-shadow: 0 0 0 .22rem rgba(32, 170, 155, .14); background: #fff; }
        #adminLoginForm .btn-admin { min-height: 48px; border-radius: 11px; font-size: 1rem; }
        @media (max-width: 480px) { body { padding: 14px 12px; } .login-card { width: 100%; border-radius: 16px; } .login-card .card-body { padding: 22px 20px 24px !important; } }
    </style>
</head>
<body>
<main class="card login-card">
    <div class="card-body p-4 p-sm-5">
        <div class="mb-4 text-center">
            <img class="brand-mark mb-3" th:src="@{/images/tecverselogo.png}" alt="Tec-verse logo">
            <div class="login-kicker mb-2">Secure workspace</div>
            <h1 class="h4 fw-black mb-1">Admin Login</h1>
            <p class="text-muted mb-0">Manage News &amp; Updates</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</div>
        <div th:if="${param.sessionExpired}" class="alert alert-warning py-2">Your admin session ended because this account signed in from another browser. Please log in again.</div>
        <div th:if="${param.captchaError}" class="alert alert-danger py-2">CAPTCHA did not match. Enter the exact uppercase and lowercase characters shown.</div>

        <form id="adminLoginForm" th:action="@{/adminportal}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="username">Username</label>
                <input id="username" name="username" type="text" class="form-control form-control-lg"
                       value="" autocomplete="off" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg"
                       value="" autocomplete="new-password" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold d-block" for="captchaAnswer">Security check</label>
                <span class="captcha-challenge mb-2" th:text="${adminCaptcha}" aria-label="CAPTCHA code">Ab3Xy7</span>
                <input id="captchaAnswer" name="captchaAnswer" type="text" class="form-control form-control-lg mt-2"
                       maxlength="6" minlength="6" autocapitalize="none" autocomplete="off" spellcheck="false" required>
            </div>
            <button class="btn btn-primary btn-admin btn-lg w-100" type="submit">Login</button>
        </form>
    </div>
</main>
</body>
</html>
