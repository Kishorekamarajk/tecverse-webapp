<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add News Update | Tec-Verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('news')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('News Updates')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4">
        <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/news-updates}"><i class="bi bi-arrow-left"></i> News &amp; Updates</a>
        <h1 class="h3 mt-2 mb-0">Add News Update</h1>
    </div>

    <section class="card form-card overflow-hidden">
        <div class="card-body p-4">
            <form data-admin-validation th:action="@{/admin/news-updates}" th:object="${newsUpdateForm}" method="post" enctype="multipart/form-data">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="title">News Title *</label>
                    <input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="220" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label fw-semibold" for="publishedDate">Date *</label>
                        <input id="publishedDate" type="date" class="form-control form-control-lg" th:field="*{publishedDate}" required>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('publishedDate')}" th:errors="*{publishedDate}"></div>
                    </div>
                    <div class="col-md-7">
                        <label class="form-label fw-semibold" for="imageFile">Choose Image File *</label>
                        <input id="imageFile" name="imageFile" type="file" class="form-control form-control-lg"
                               accept="image/png,image/jpeg,image/webp,image/gif" data-max-file-bytes="1048576" required>
                        <div class="form-text">Choose a JPG, PNG, WEBP, or GIF image, up to 1 MB.</div>
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label fw-semibold" for="excerpt">Short Description *</label>
                    <textarea id="excerpt" class="form-control" th:field="*{excerpt}" rows="3" maxlength="500" required></textarea>
                    <div class="form-text">Shown on the News &amp; Updates card before Read More.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('excerpt')}" th:errors="*{excerpt}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="content">Full News Content *</label>
                    <textarea id="content" class="form-control" th:field="*{content}" rows="10" maxlength="10000" required></textarea>
                    <div class="form-text">Use a new line between paragraphs. This text appears on the detail page.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label fw-semibold" for="active">Publish on website</label>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save</button>
                    <a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/news-updates}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>
 </div>
 </div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js" integrity="sha384-DIFfDxcYkhbAXYdxOYFZshXsis24zK4HtbU7qI30u9/eP7JtiRIGuOaLsoYL5QTs" crossorigin="anonymous"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
