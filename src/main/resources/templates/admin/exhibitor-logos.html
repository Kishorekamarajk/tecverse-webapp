<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibitor Logos | Tec-verse Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('exhibitor-logos')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Exhibitor Logos')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div><h1 class="h3 mb-1">Exhibitor Logos</h1><p class="text-muted mb-0">Manage the logos and stall allocations shown on the home page.</p></div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/exhibitor-logos/new}"><i class="bi bi-plus-lg me-1"></i> Add Exhibitor Logo</a>
    </div>
    <div th:if="${param.saved}" class="alert alert-success">Exhibitor logo added.</div>
    <div th:if="${param.updated}" class="alert alert-success">Exhibitor logo updated.</div>
    <section class="table-card bg-white overflow-hidden"><div class="table-responsive">
        <table class="table align-middle mb-0 table-hover">
            <thead class="table-light"><tr><th>Logo</th><th>Company</th><th>Stall Allocation</th><th>Order</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(exhibitorLogos)}"><td colspan="6" class="py-5 text-center text-muted">No exhibitor logos added yet.</td></tr>
            <tr th:each="item : ${exhibitorLogos}">
                <td><img th:src="@{${item.imageUrl}}" th:alt="|${item.companyName} logo|" style="width:110px;height:64px;object-fit:contain"></td>
                <td class="fw-semibold" th:text="${item.companyName}">Company</td><td th:text="${item.stallAllocation}">3 × 6</td><td th:text="${item.displayOrder}">0</td>
                <td><span th:if="${item.active}" class="badge text-bg-success rounded-pill">Active</span><span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Inactive</span></td>
                <td class="text-end"><div class="d-inline-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/exhibitor-logos/{id}/edit(id=${item.id})}" title="Edit"><i class="bi bi-pencil"></i></a>
                    <form th:action="@{/admin/exhibitor-logos/{id}/toggle(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" title="Toggle status"><i th:class="${item.active} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i></button></form>
                    <form th:action="@{/admin/exhibitor-logos/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this exhibitor logo?');"><button class="btn btn-sm btn-outline-danger" type="submit" title="Delete"><i class="bi bi-trash"></i></button></form>
                </div></td>
            </tr>
            </tbody>
        </table>
    </div></section>
</main></div></div>
<script th:src="@{/js/admin.js}"></script>
</body></html>
