<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News &amp; Updates Admin | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('news')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('News Updates')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin}"><i class="bi bi-arrow-left"></i> Dashboard</a>
            <h1 class="h3 mt-2 mb-0">News &amp; Updates</h1>
        </div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/news-updates/new}"><i class="bi bi-plus-lg me-1"></i> Add News Update</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Saved.</div>

    <section class="table-card bg-white overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 table-hover">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Public Link</th>
                    <th class="text-end">Delete</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(newsUpdates)}">
                    <td colspan="5" class="py-5 text-center text-muted">No dynamic news updates saved yet.</td>
                </tr>
                <tr th:each="item : ${newsUpdates}">
                    <td class="fw-semibold" th:text="${item.title}">News title</td>
                    <td th:text="${item.dateLabel}">18 Jun 2026</td>
                    <td>
                        <span th:if="${item.active}" class="badge text-bg-success rounded-pill">Published</span>
                        <span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Hidden</span>
                    </td>
                    <td>
                        <a th:if="${item.active}" th:href="@{/news-updates/{slug}(slug=${item.slug})}" target="_blank" rel="noopener">Open</a>
                        <span th:unless="${item.active}" class="text-muted">Hidden</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/news-updates/{id}/delete(id=${item.id})}" method="post"
                              data-confirm="Delete this news update?">
                            <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Delete news update">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
 </div>
 </div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
