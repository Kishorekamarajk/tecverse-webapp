<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
    <style>
        .action-tile { text-decoration: none; color: inherit; }
    </style>
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('dashboard')}"></div>

    <div class="admin-main-panel">
        <div th:replace="~{admin/fragments/admin-layout :: topbar('Dashboard')}"></div>

        <main class="admin-workspace d-flex justify-content-center">
            <section class="admin-dashboard-card card">
                <div class="admin-section-title d-flex align-items-start">
                    <span class="admin-section-icon d-inline-flex align-items-center justify-content-center flex-shrink-0"><i class="bi bi-bar-chart-line"></i></span>
                    <div>
                        <h1>Dashboard</h1>
                        <p>Submission totals from the database.</p>
                    </div>
                </div>

                <div class="admin-submission-counts row g-3 mb-4">
                    <div class="col-12 col-sm-6 col-xl-3">
                        <article class="admin-submission-count h-100">
                            <span>Ticket registrations</span>
                            <strong th:text="${submissionCounts?.ticketRegistrations ?: 0}">0</strong>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <article class="admin-submission-count h-100">
                            <span>Exhibitors</span>
                            <strong th:text="${submissionCounts?.exhibitors ?: 0}">0</strong>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <article class="admin-submission-count h-100">
                            <span>Sponsor enquiries</span>
                            <strong th:text="${submissionCounts?.sponsors ?: 0}">0</strong>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <article class="admin-submission-count h-100">
                            <span>Contact enquiries</span>
                            <strong th:text="${submissionCounts?.contactUs ?: 0}">0</strong>
                        </article>
                    </div>
                </div>

                <div class="admin-submission-chart-wrap">
                    <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
                        <div>
                            <h2>Submissions by type</h2>
                            <p>Live totals from the database</p>
                        </div>
                        <span class="admin-chart-total">Total: <strong th:text="${(submissionCounts?.ticketRegistrations ?: 0) + (submissionCounts?.exhibitors ?: 0) + (submissionCounts?.sponsors ?: 0) + (submissionCounts?.contactUs ?: 0)}">0</strong></span>
                    </div>
                    <canvas id="adminSubmissionChart" role="img" aria-label="Bar chart showing ticket registration, exhibitor, sponsor, and contact enquiry totals from the database"></canvas>
                </div>

                <div class="row g-3 mt-3">
                    <div class="col-12 col-md-6">
                        <a class="action-tile d-flex flex-column justify-content-center p-4 text-decoration-none" th:href="@{/admin/id-cards}">
                            <strong><i class="bi bi-person-vcard me-2 text-success"></i>ID Card Generator</strong>
                            <span class="small text-secondary mt-2">Create and download Speaker, Organizer, and VIP ID cards.</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
<script th:nonce="${cspNonce}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById("adminSubmissionChart");
        if (!canvas || typeof Chart === "undefined") return;

        new Chart(canvas, {
            type: "bar",
            data: {
                labels: ["Ticket registrations", "Exhibitors", "Sponsors", "Contact us"],
                datasets: [{
                    label: "Submissions",
                    data: [
                        /*[[${submissionCounts?.ticketRegistrations ?: 0}]]*/ 0,
                        /*[[${submissionCounts?.exhibitors ?: 0}]]*/ 0,
                        /*[[${submissionCounts?.sponsors ?: 0}]]*/ 0,
                        /*[[${submissionCounts?.contactUs ?: 0}]]*/ 0
                    ],
                    backgroundColor: ["#233373", "#0879e8", "#ff6415", "#008b73"],
                    borderSkipped: false,
                    borderRadius: 8,
                    maxBarThickness: 76
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: true }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 1,
                        ticks: { precision: 0, stepSize: 1, color: "#64748b" },
                        grid: { color: "#e8eef4" },
                        border: { display: false }
                    },
                    x: {
                        ticks: { color: "#253047", font: { weight: 600 } },
                        grid: { display: false },
                        border: { display: false }
                    }
                }
            }
        });
    });
</script>
</body>
</html>
