<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Dates | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .date-icon-preview { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #00856f; color: #fff; font-size: 1.1rem; }
        .color-swatch { display: inline-block; width: 28px; height: 28px; border: 1px solid #d5dce2; border-radius: 50%; vertical-align: middle; }
    </style>
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('important-dates')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Important Dates Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin}"><i class="bi bi-arrow-left"></i> Dashboard</a>
            <h1 class="h3 mt-2 mb-0">Important Dates</h1>
            <p class="text-muted mb-0">Manage the milestones shown in the public home page panel.</p>
        </div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/important-dates/new}"><i class="bi bi-plus-lg me-1"></i> Add Important Date</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Saved.</div>

    <section class="table-card bg-white overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 table-hover">
                <thead class="table-light">
                <tr><th>Icon</th><th>Title</th><th>Date</th><th>Color</th><th>Order</th><th>Status</th><th class="text-end">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(importantDates)}"><td colspan="7" class="py-5 text-center text-muted">No important dates saved yet.</td></tr>
                <tr th:each="item : ${importantDates}">
                    <td><span class="date-icon-preview" th:style="|background-color:${item.accentColor}|"><i th:class="|bi ${item.iconClass}|"></i></span></td>
                    <td class="fw-semibold" th:text="${item.title}">Registration Starts</td>
                    <td th:text="${item.dateLabel}">21 June 2026</td>
                    <td><span class="color-swatch" th:style="|background-color:${item.accentColor}|" th:title="${item.accentColor}"></span></td>
                    <td th:text="${item.displayOrder}">0</td>
                    <td><span th:if="${item.active}" class="badge text-bg-success rounded-pill">Active</span><span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Inactive</span></td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/important-dates/{id}/edit(id=${item.id})}" title="Edit"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/important-dates/{id}/toggle(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" title="Toggle status"><i th:class="${item.active} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i></button></form>
                            <form th:action="@{/admin/important-dates/{id}/delete(id=${item.id})}" method="post" data-confirm="Delete this important date?"><button class="btn btn-sm btn-outline-danger" type="submit" title="Delete"><i class="bi bi-trash"></i></button></form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
