<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Edit ' + ${title} + ' | Admin'">Edit registration | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page">
<div class="admin-app-shell min-vh-100">
    <div th:replace="~{admin/fragments/admin-layout :: sidebar('dashboard')}"></div>
    <div class="admin-main-panel">
        <div th:replace="~{admin/fragments/admin-layout :: topbar('View / edit ' + ${title})}"></div>
        <main class="admin-workspace">
            <section class="admin-dashboard-card card p-4">
                <h1 class="mb-1" th:text="'View / edit ' + ${title}">View / edit registration</h1>
                <p class="text-secondary">Update the submitted fields and save your changes.</p>
                <form method="post" th:action="@{/admin/registrations/{type}/{id}(type=${type},id=${id})}">
                    <div class="row g-3">
                        <div class="col-12 col-md-6" th:each="field : ${fields}">
                            <label class="form-label fw-semibold" th:for="${field.key}" th:text="${field.label}">Field</label>
                            <textarea th:if="${field.key == 'message' || field.key == 'remarks' || field.key == 'attendanceDays'}" class="form-control" rows="3" th:id="${field.key}" th:name="${field.key}" th:text="${field.value}"></textarea>
                            <input th:unless="${field.key == 'message' || field.key == 'remarks' || field.key == 'attendanceDays'}" class="form-control" th:id="${field.key}" th:name="${field.key}" th:value="${field.value}" th:type="${field.key == 'email' ? 'email' : 'text'}" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Save changes</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/registrations/{type}(type=${type})}">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
