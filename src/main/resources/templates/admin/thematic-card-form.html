<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thematic Areas | Tec-Verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('thematic')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Thematic Areas')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4">
        <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/thematic-cards}"><i class="bi bi-arrow-left"></i> Thematic Areas</a>
        <h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit' ? 'Update Thematic Area' : 'Add Thematic Area'}">Add Thematic Area</h1>
    </div>

    <section class="card form-card overflow-hidden">
        <div class="card-body p-4">
            <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/thematic-cards/{id}(id=${thematicCardId})} : @{/admin/thematic-cards}" th:object="${thematicDomainCardForm}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="institution">Institution *</label>
                        <select id="institution" class="form-select form-select-lg" th:field="*{institution}" required>
                            <option value="cdac">C-DAC</option>
                            <option value="sameer">SAMEER</option>
                            <option value="cmet">C-MET</option>
                        </select>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('institution')}" th:errors="*{institution}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="displayOrder">Display Order *</label>
                        <input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}" required>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label fw-semibold" for="title">Thematic Area *</label>
                    <input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="180" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="icon">Bootstrap Icon Name *</label>
                    <select id="icon" class="form-select form-select-lg" th:field="*{icon}" required>
                        <option value="stars">Stars</option>
                        <option value="cpu-fill">CPU Fill</option>
                        <option value="robot">Robot</option>
                        <option value="cpu">CPU</option>
                        <option value="shield-lock">Shield Lock</option>
                        <option value="code-slash">Code</option>
                        <option value="flag">Flag</option>
                        <option value="link-45deg">Link</option>
                        <option value="reception-4">Communication</option>
                        <option value="shield-check">Shield Check</option>
                        <option value="cloud-sun">Cloud and Sun</option>
                        <option value="heart-pulse-fill">Healthcare</option>
                        <option value="broadcast">Broadcast</option>
                        <option value="gear-wide-connected">Industrial Gear</option>
                        <option value="memory">Memory</option>
                        <option value="lightning-charge">Lightning</option>
                        <option value="box-seam">Box</option>
                        <option value="battery-charging">Battery Charging</option>
                        <option value="recycle">Recycle</option>
                        <option value="layers">Layers</option>
                    </select>
                    <div class="form-text">Choose an icon for this thematic card.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('icon')}" th:errors="*{icon}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="description">Description *</label>
                    <textarea id="description" class="form-control" th:field="*{description}" rows="5" maxlength="600" required></textarea>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label fw-semibold" for="active">Publish on website</label>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i><span th:text="${mode == 'edit' ? 'Update' : 'Save'}">Save</span></button>
                    <a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/thematic-cards}">Cancel</a>
                </div>
            </form>
        </div>
    </section>
</main>
 </div>
 </div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js" integrity="sha384-DIFfDxcYkhbAXYdxOYFZshXsis24zK4HtbU7qI30u9/eP7JtiRIGuOaLsoYL5QTs" crossorigin="anonymous"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
