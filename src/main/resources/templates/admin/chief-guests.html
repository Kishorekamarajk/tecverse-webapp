<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chief Guests | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .guest-admin-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; border: 2px solid var(--bs-border-color); }
        .color-swatch { width: 28px; height: 28px; border-radius: 50%; display: inline-block; vertical-align: middle; border: 1px solid #d5dce2; }
    </style>
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('chief-guests')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Chief Guest Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin}"><i class="bi bi-arrow-left"></i> Dashboard</a>
            <!-- <h1 class="h3 mt-2 mb-0">Chief Guests</h1> -->
            <p class="h3 mt-2 mb-0">Manage the cards shown in the home page carousel.</p>
        </div>
        <a class="btn btn-success fw-bold" th:href="@{/admin/chief-guests/new}"><i class="bi bi-plus-lg me-1"></i> Add Chief Guest</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Saved.</div>

    <section class="table-card bg-white overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 table-hover">
                <thead class="table-light">
                <tr><th>Photo</th><th>Name</th><th>Designation</th><th>Organization</th><th>Color</th><th>Order</th><th>Status</th><th class="text-end">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(chiefGuests)}"><td colspan="8" class="py-5 text-center text-muted">No chief guests saved yet.</td></tr>
                <tr th:each="item : ${chiefGuests}">
                    <td><img class="guest-admin-thumb" th:src="@{${item.imageUrl}}" th:alt="${item.name}"></td>
                    <td class="fw-semibold" th:text="${item.name}">Name</td>
                    <td th:text="${item.designation}">Designation</td>
                    <td th:text="${item.organization != null and !item.organization.isBlank()} ? ${item.organization} : 'Not set'">Organization</td>
                    <td><span class="color-swatch" th:style="|background-color:${item.accentColor}|" th:title="${item.accentColor}"></span></td>
                    <td th:text="${item.displayOrder}">0</td>
                    <td><span th:if="${item.active}" class="badge text-bg-success rounded-pill">Active</span><span th:unless="${item.active}" class="badge text-bg-secondary rounded-pill">Inactive</span></td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/chief-guests/{id}/edit(id=${item.id})}" title="Edit"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/admin/chief-guests/{id}/toggle(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" title="Toggle status"><i th:class="${item.active} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i></button></form>
                            <form th:action="@{/admin/chief-guests/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this chief guest?');"><button class="btn btn-sm btn-outline-danger" type="submit" title="Delete"><i class="bi bi-trash"></i></button></form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
