<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${mode == 'edit'} ? 'Edit Important Date | Tec-verse' : 'Add Important Date | Tec-verse'">Important Date | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('important-dates')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Important Dates Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4">
        <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/important-dates}"><i class="bi bi-arrow-left"></i> Important Dates</a>
        <h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit'} ? 'Edit Important Date' : 'Add Important Date'">Add Important Date</h1>
    </div>
    <section class="card form-card overflow-hidden"><div class="card-body p-4">
        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/important-dates/{id}(id=${importantDateId})} : @{/admin/important-dates}"
              th:object="${importantDateForm}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-semibold" for="title">Title *</label>
                    <input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="160" required placeholder="Registration Starts">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold" for="displayOrder">Display Order</label>
                    <input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div>
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-semibold" for="eventDate">Event Date *</label>
                    <input id="eventDate" type="date" class="form-control form-control-lg" th:field="*{eventDate}" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold" for="iconClass">Bootstrap Icon Class *</label>
                    <select id="iconClass" class="form-select form-select-lg" th:field="*{iconClass}" required>
                        <option value="bi-calendar-event">Calendar Event</option>
                        <option value="bi-calendar-check">Calendar Check</option>
                        <option value="bi-calendar-date">Calendar Date</option>
                        <option value="bi-calendar-week">Calendar Week</option>
                        <option value="bi-calendar2-check">Calendar 2 Check</option>
                        <option value="bi-calendar3">Calendar 3</option>
                        <option value="bi-clock">Clock</option>
                        <option value="bi-hourglass-split">Hourglass</option>
                        <option value="bi-pencil-square">Registration</option>
                        <option value="bi-megaphone">Announcement</option>
                        <option value="bi-person-plus">Person Plus</option>
                        <option value="bi-people-fill">People</option>
                        <option value="bi-journal-check">Journal Check</option>
                        <option value="bi-cash-coin">Cash</option>
                        <option value="bi-credit-card">Credit Card</option>
                        <option value="bi-trophy">Trophy</option>
                        <option value="bi-flag">Flag</option>
                        <option value="bi-geo-alt">Location</option>
                        <option value="bi-ticket-perforated">Ticket</option>
                    </select>
                    <div class="form-text">Choose the icon shown beside this important date.</div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('iconClass')}" th:errors="*{iconClass}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold" for="accentColor">Icon Accent Color</label>
                    <input id="accentColor" type="color" class="form-control form-control-color" th:field="*{accentColor}" required title="Choose icon accent color">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('accentColor')}" th:errors="*{accentColor}"></div>
                </div>
            </div>
            <div class="form-check form-switch my-4">
                <input id="active" class="form-check-input" type="checkbox" th:field="*{active}">
                <label class="form-check-label fw-semibold" for="active">Show this date on the public home page</label>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save Important Date</button>
                <a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/important-dates}">Cancel</a>
            </div>
        </form>
    </div></section>
</main>
</div>
</div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
