<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibitor Logo | Tec-verse Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('exhibitor-logos')}"></div>
<div class="admin-main-panel"><div th:replace="~{admin/fragments/admin-layout :: topbar('Exhibitor Logos')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4"><a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/exhibitor-logos}"><i class="bi bi-arrow-left"></i> Exhibitor Logos</a><h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit'} ? 'Edit Exhibitor Logo' : 'Add Exhibitor Logo'">Add Exhibitor Logo</h1></div>
    <section class="card form-card overflow-hidden"><div class="card-body p-4">
        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/exhibitor-logos/{id}(id=${logoId})} : @{/admin/exhibitor-logos}" th:object="${exhibitorLogoForm}" method="post" enctype="multipart/form-data">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="companyName">Company Name *</label><input id="companyName" class="form-control form-control-lg" th:field="*{companyName}" maxlength="180" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="websiteUrl">Company Website (optional)</label><input id="websiteUrl" type="url" class="form-control form-control-lg" th:field="*{websiteUrl}" maxlength="500" placeholder="https://example.com"><div class="form-text">Clicking this logo on the homepage will open this website.</div><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('websiteUrl')}" th:errors="*{websiteUrl}"></div></div>
            <div class="row g-3">
                <div class="col-md-7"><label class="form-label fw-semibold" for="imageFile" th:text="${mode == 'edit'} ? 'Replace Logo' : 'Logo *'">Logo *</label><input id="imageFile" name="imageFile" type="file" class="form-control form-control-lg" accept="image/png,image/jpeg,image/webp,image/gif" data-max-file-bytes="1048576" th:required="${mode != 'edit'}"><div class="form-text">JPG, PNG, WEBP, or GIF; maximum 1 MB.</div><img th:if="${mode == 'edit' and currentImageUrl != null}" th:src="@{${currentImageUrl}}" alt="Current exhibitor logo" class="mt-2 rounded" style="max-width:220px;max-height:120px;object-fit:contain"></div>
                <div class="col-md-5"><label class="form-label fw-semibold" for="stallAllocation">Stall Allocation *</label><input id="stallAllocation" class="form-control form-control-lg" th:field="*{stallAllocation}" maxlength="80" placeholder="3 × 6" required><div class="form-text">Example: 3 × 6</div><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('stallAllocation')}" th:errors="*{stallAllocation}"></div></div>
                <div class="col-md-5"><label class="form-label fw-semibold" for="displayOrder">Display Order</label><input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}"></div>
            </div>
            <div class="form-check form-switch my-4"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label fw-semibold" for="active">Show on home page</label></div>
            <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save Exhibitor</button><a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/exhibitor-logos}">Cancel</a></div>
        </form>
    </div></section>
</main></div></div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js" integrity="sha384-DIFfDxcYkhbAXYdxOYFZshXsis24zK4HtbU7qI30u9/eP7JtiRIGuOaLsoYL5QTs" crossorigin="anonymous"></script><script th:src="@{/js/jquery-form-validation.js}"></script><script th:src="@{/js/admin.js}"></script>
</body></html>
