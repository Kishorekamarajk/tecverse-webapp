<div xmlns:th="http://www.thymeleaf.org" th:fragment="rows">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr th:if="${kind == 'bookings'}"><th>Participant</th><th>Registration ref</th><th>Session</th><th>Type</th><th>Reserved</th></tr>
                <tr th:if="${kind == 'participants'}"><th>Participant</th><th>Registration ref</th><th>Confirmed sessions</th></tr></thead>
            <tbody>
            <tr th:if="${kind == 'bookings'}" th:each="row : ${page.content}"><td th:text="${row.attendeeName}">Participant</td><td th:text="${row.registrationReference}">Reference</td><td th:text="${row.sessionTitle}">Session</td><td th:text="${row.sessionType == 'TUTORIAL' ? 'Tutorial' : 'Session'}">Type</td><td th:text="${row.reservedAt != null ? #temporals.format(row.reservedAt, 'dd MMM yyyy HH:mm') : ''}">Reserved</td></tr>
            <tr th:if="${kind == 'participants'}" th:each="row : ${participants}"><td th:text="${row.name}">Participant</td><td th:text="${row.reference}">Reference</td><td th:text="${row.sessions}">Sessions</td></tr>
            <tr th:if="${page.empty}"><td colspan="5" class="text-center text-secondary py-4">No confirmed session reservations yet.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${page.totalPages > 1}" class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3" aria-label="Session reservation pages">
        <span class="small text-secondary" th:text="|Showing ${page.number * page.size + 1}–${page.number * page.size + page.numberOfElements} of ${page.totalElements}|">Showing records</span>
        <div class="btn-group" role="group" aria-label="Pagination controls">
            <button type="button" class="btn btn-sm btn-outline-primary" data-registration-page="prev" th:disabled="${page.first}">Previous</button>
            <span class="btn btn-sm btn-outline-secondary disabled" th:text="|Page ${page.number + 1} of ${page.totalPages}|">Page 1 of 1</span>
            <button type="button" class="btn btn-sm btn-outline-primary" data-registration-page="next" th:disabled="${page.last}">Next</button>
        </div>
    </nav>
</div>
