<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Image | Tec-verse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-dashboard-page overflow-x-hidden">
<div class="admin-app-shell min-vh-100 overflow-x-hidden">
<div th:replace="~{admin/fragments/admin-layout :: sidebar('gallery')}"></div>
<div class="admin-main-panel">
<div th:replace="~{admin/fragments/admin-layout :: topbar('Gallery Management')}"></div>
<main class="admin-shell container-fluid mx-auto">
    <div class="mb-4">
        <a class="text-decoration-none small fw-semibold text-success" th:href="@{/admin/gallery(tab='images')}"><i class="bi bi-arrow-left"></i> Gallery</a>
        <h1 class="h3 mt-2 mb-0" th:text="${mode == 'edit'} ? 'Edit Gallery Image' : 'Add Gallery Image'">Add Gallery Image</h1>
    </div>
    <section class="card form-card overflow-hidden"><div class="card-body p-4">
        <form data-admin-validation th:action="${mode == 'edit'} ? @{/admin/gallery/images/{id}(id=${imageId})} : @{/admin/gallery/images}" th:object="${galleryImageForm}" method="post" enctype="multipart/form-data">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="title">Title *</label><input id="title" class="form-control form-control-lg" th:field="*{title}" maxlength="180" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="category">Category / Label *</label><input id="category" class="form-control form-control-lg" th:field="*{category}" maxlength="120" placeholder="Inaugural Address" required><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div></div>
            <div class="row g-3">
                <div class="col-md-7"><label class="form-label fw-semibold" for="imageFile" th:text="${mode == 'edit'} ? 'Upload Replacement Image' : 'Upload Image *'">Upload Image *</label><input id="imageFile" name="imageFile" type="file" class="form-control form-control-lg" accept="image/png,image/jpeg,image/webp,image/gif" data-max-file-bytes="1048576" th:required="${mode != 'edit'}"><div class="form-text">Choose a JPG, PNG, WEBP, or GIF image up to 1 MB. Leave empty to keep the current image when editing.</div><div class="mt-2" th:if="${mode == 'edit' and currentImageUrl != null and !currentImageUrl.isBlank()}"><img th:src="@{${currentImageUrl}}" alt="Current gallery image" class="rounded" style="max-width: 220px; max-height: 160px; object-fit: cover;"></div></div>
                <div class="col-md-5"><label class="form-label fw-semibold" for="displayOrder">Display Order</label><input id="displayOrder" type="number" min="0" class="form-control form-control-lg" th:field="*{displayOrder}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></div></div>
            </div>
            <div class="form-check form-switch my-4"><input id="active" class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label fw-semibold" for="active">Active on public Gallery</label></div>
            <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary btn-save btn-lg" type="submit"><i class="bi bi-save me-1"></i> Save</button><a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/gallery(tab='images')}">Cancel</a></div>
        </form>
    </div></section>
</main>
 </div>
 </div>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
<script th:src="@{/js/jquery-form-validation.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
