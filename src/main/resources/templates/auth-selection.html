<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Register | Tec-Verse 2026</title><link rel="stylesheet" th:href="@{/css/style.css}"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071b38,#45228b);font-family:system-ui,sans-serif}.auth-wrap{width:min(960px,92vw);color:#fff}.auth-brand{text-align:center;margin-bottom:2rem}.auth-brand img{width:78px}.auth-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}.auth-card{background:#fff;color:#142542;border-radius:20px;padding:2rem;box-shadow:0 16px 40px #06142a55}.auth-card h2{font-size:1.65rem}.auth-card p{min-height:3.5em;color:#59677c;line-height:1.6}.auth-card a{display:inline-block;padding:.8rem 1.3rem;background:#5127b8;border-radius:9px;color:#fff;font-weight:700;text-decoration:none}.auth-card a:focus-visible{outline:3px solid #f5c84c;outline-offset:3px}@media(max-width:640px){.auth-grid{grid-template-columns:1fr}.auth-card{padding:1.5rem}}</style><link rel="stylesheet" th:href="@{/css/attendee-portal.css}"></head><body><main class="auth-wrap"><header class="auth-brand"><img th:src="@{/images/tecverselogo.png}" alt="Tec-Verse"><h1>Tec-Verse 2026</h1><p>Choose how you’d like to continue</p></header><div class="auth-grid"><section class="auth-card"><h2>Welcome Back!</h2><p>Log in to manage your Tec-Verse 2026 registration and thematic sessions.</p><a th:href="@{/login}">Login</a></section><section class="auth-card"><h2>New to Tec-Verse 2026?</h2><p>Register for the event and access your personalized attendee dashboard.</p><a th:href="@{/ticket}">Register</a></section></div></main></body></html>
