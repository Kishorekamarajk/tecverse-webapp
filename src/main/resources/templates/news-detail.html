<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${newsItem.title + ' | Tec-verse 2026'}">News Detail | Tec-verse 2026</title>
    <link rel="icon" type="image/png" th:href="@{/images/tecverselogo.png}">



    <link rel="stylesheet" th:href="@{/css/fonts.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = { corePlugins: { preflight: false }, theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="news-detail-page no-hero bg-white font-sans text-ink antialiased">

<div th:replace="~{fragments/navbar :: navbar('news')}"></div>

<main class="news-detail-section">
    <div class="container">

        <div class="row">
            <div class="col-md-8 ms-auto me-auto">
                 <article class=" news-detail max-w-[980px]">
 <header class="news-detail__header max-w-[900px]">
            <h1 th:text="${newsItem.title}">Shri Chandubhai Virani Joins Tech Expo Chennai 2026 As An Esteemed Speaker</h1>
        </header>

        <figure class="news-detail__media overflow-hidden rounded-[0]">
            <img th:src="@{${newsItem.image}}" th:alt="${newsItem.title}">
        </figure>

        <div class="news-detail__content max-w-[100%] pb-[2.5rem]">
            <p class="news-card__date leading-[1.35]"><strong>Date:</strong> <span th:text="${newsItem.date}">25 Apr 2026</span></p>
            <p th:each="paragraph : ${newsItem.paragraphs}" th:text="${paragraph}">Article paragraph.</p>
        </div>
         </article>
            </div>
        </div>

       </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
