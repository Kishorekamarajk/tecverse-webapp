# Port 587 uses STARTTLS. Keep implicit TLS off unless the mail administrator
# explicitly supplies a separate implicit-TLS endpoint and port.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:30000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:30000}

# Read-only admin account. Supply its password through the deployment secret store.
tecverse.admin.viewer.username=${ADMIN_VIEWER_USERNAME:tecview@cdac.in}
tecverse.admin.viewer.password=${ADMIN_VIEWER_PASSWORD:Tec1234#$}
tecverse.admin.viewer.password-hash=${ADMIN_VIEWER_PASSWORD_HASH:}




# =========================================================
# JPA / Hibernate
# =========================================================
# Validate the pre-migrated schema at startup; do not mutate production schemas
# automatically. Apply reviewed database migrations before deploying the app.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:25}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_BATCH_FETCH_SIZE:25}
spring.jpa.open-in-view=false

