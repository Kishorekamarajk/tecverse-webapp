spring.application.name=tecverse
server.port=2304
server.servlet.session.tracking-modes=cookie

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# thymeleaf configuration
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.freemarker.check-template-location=false
# Limit each uploaded file to 1 MB. The request limit allows multipart form overhead.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=25MB

# Static assets (css/js/images) had no Cache-Control header, so browsers fell back to
# heuristic caching and kept serving an old style.css after a redeploy until a hard
# refresh - this is what caused the exhibitors/venue/contact-map alignment to look
# broken on staging even though the deployed CSS/HTML were already correct. Forcing
# revalidation on every request means a redeploy is picked up immediately.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# =========================================================
# Datasource (PostgreSQL)
# =========================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:120000}


# =========================================================
# SMTP / Email
# =========================================================
# SMTP values are supplied by environment variables so local and company
# networks can use different documented endpoints without changing code.
spring.mail.host=${MAIL_HOST:smtp.cdac.in}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tec-verse@cdac.in}
spring.mail.password=${MAIL_PASSWORD:Tecverse0212@#!}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}


