about.hero.subtitle=MeitY के समर्थन से C-DAC, SAMEER और C-MET द्वारा संयुक्त रूप से आयोजित तकनीकी प्रदर्शनी, जिसका उद्देश्य स्वदेशी अनुसंधान एवं विकास को उद्योग और नागरिकों के करीब लाना है।
about.section.eyebrow=टेक-वर्स के बारे में
about.section.p1=टेक-वर्स, MeitY के प्रमुख अनुसंधान एवं विकास संगठनों—C-DAC, SAMEER और C-MET—द्वारा परिकल्पित तकनीकी प्रदर्शनी और सम्मेलन है। इसका पहला संस्करण, टेक-वर्स 2025, 27–28 जून 2025 को नई दिल्ली के मानेकशॉ सेंटर में आयोजित हुआ। यह स्वदेशी डीप-टेक समाधानों को प्रदर्शित करने और उनके व्यावसायीकरण के लिए एक साझा मंच था।
about.section.p2=2025 के संस्करण में उच्च-प्रदर्शन कंप्यूटिंग, क्वांटम तकनीक, AI, साइबर सुरक्षा, सेमीकंडक्टर, दूरसंचार, स्वास्थ्य सेवा, कृषि, पावर इलेक्ट्रॉनिक्स, रोबोटिक्स, UAV, IoT और इंडस्ट्री 4.0 जैसे क्षेत्रों की 150 से अधिक तकनीकें शामिल थीं। इसने मंत्रालयों, उद्योग, स्टार्टअप्स, अकादमिक जगत और अनुसंधान समुदायों को बाजार के लिए तैयार भारतीय तकनीकों के इर्द-गिर्द जोड़ा।
about.journey.heading=टेक-वर्स की यात्रा
about.journey.subtitle=2025 में MeitY के पहले अनुसंधान एवं विकास प्रदर्शन से भारतीय डीप-टेक सहयोग के अगले मंच तक।
about.journey.2023.title=आधारशिला रखना
about.journey.2023.desc=पहले संस्करण में शुरुआती नवप्रवर्तक, सरकारी निकाय और अकादमिक जगत एक साथ आए। इसमें उन प्रमुख विषयगत क्षेत्रों की शुरुआत हुई, जो आने वाले वर्षों में टेक-वर्स की पहचान बनेंगे।
