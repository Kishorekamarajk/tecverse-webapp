misc.privacy.lead=Tec-Verse 2026 वेबसाइट और मोबाइल ऐप · अंतिम अद्यतन: 28 अक्टूबर 2026
misc.privacy.intro=Tec-Verse 2026 (Android package: in.cdac.tecverse.tec_app) का आयोजन प्रगत संगणन विकास केंद्र (C-DAC) द्वारा किया जा रहा है। यह नीति बताती है कि हम Tec-Verse वेबसाइट (https://tec-verse.cdac.in) और Tec-Verse 2026 Android ऐप के माध्यम से कौन-सा व्यक्तिगत डेटा एकत्र करते हैं, उसे क्यों एकत्र करते हैं, और इस संबंध में आपके पास कौन-से विकल्प हैं।
misc.privacy.s1.heading=1. हम कौन-सा डेटा एकत्र करते हैं
misc.privacy.s1.registration=<strong>पंजीकरण विवरण:</strong> नाम, ईमेल पता, मोबाइल नंबर, पासवर्ड (केवल वन-वे हैश के रूप में संग्रहीत), पंजीकरण श्रेणी, संगठन / संस्थान, पदनाम, शहर, छात्र आईडी (केवल छात्रों के लिए) और उपस्थिति के पसंदीदा दिन।
misc.privacy.s1.passport=<strong>पासपोर्ट विवरण (केवल विदेशी नागरिकों के लिए):</strong> पासपोर्ट संख्या, समाप्ति तिथि और पासपोर्ट में दर्ज नाम, जिनका उपयोग कार्यक्रम की सुरक्षा और प्रवेश के लिए किया जाता है।
misc.privacy.s1.enquiries=<strong>प्रदर्शक और प्रायोजक पूछताछ:</strong> कंपनी और संपर्क विवरण, तथा आपके द्वारा अपलोड किए गए दस्तावेज़।
misc.privacy.s1.appUsage=<strong>ऐप उपयोग:</strong> आपके द्वारा चुनी गई प्रौद्योगिकी रुचियाँ, ऐप के कार्यक्रम FAQ में खोजने के लिए भेजे गए टेक्स्ट प्रश्न (वॉइस इनपुट से पहचाने गए टेक्स्ट सहित), आपको दिखाई गई सूचनाएँ और कार्यक्रम में आपकी चेक-इन स्थिति।
misc.privacy.s1.microphone=<strong>माइक्रोफ़ोन (वैकल्पिक):</strong> केवल आपके वॉइस सर्च शुरू करने पर, आपके डिवाइस की स्पीच-रिकग्निशन सेवा ऑडियो संसाधित करके पहचाना गया टेक्स्ट ऐप को देती है। ऑडियो का प्रसंस्करण उस सेवा प्रदाता की गोपनीयता प्रथाओं के अधीन है; Tec-Verse को पहचाना गया टेक्स्ट मिलता है और हम ऑडियो रिकॉर्ड या संग्रहीत नहीं करते।
misc.privacy.s1.note=ऐप आपके डिवाइस के GPS स्थान, संपर्क, फ़ोटो या विज्ञापन पहचानकर्ता तक पहुँच नहीं करता। यदि आप शुरुआती स्थान दर्ज करके दिशा-निर्देश चुनते हैं, तो वह स्थान आपके चुने हुए मैप प्रदाता के साथ खुलने वाले लिंक में शामिल होता है। हम व्यक्तिगत डेटा का उपयोग विज्ञापन के लिए नहीं करते।
misc.privacy.s2.heading=2. हम इसका उपयोग कैसे करते हैं
misc.privacy.s2.item1=कार्यक्रम के लिए आपका पंजीकरण करने, आपका डिजिटल पास और QR कोड जारी करने, तथा स्थल पर प्रवेश सत्यापित करने के लिए।
misc.privacy.s2.item2=वन-टाइम पासवर्ड (OTP) द्वारा आपका ईमेल सत्यापित करने और आपको पासवर्ड रीसेट करने की सुविधा देने के लिए।
misc.privacy.s2.item3=Tec-Verse 2026 से संबंधित कार्यक्रम अपडेट, पुष्टिकरण और सूचनाएँ भेजने के लिए।
misc.privacy.s2.item4=कार्यक्रम की योजना बनाने और उसे सुरक्षित रखने के लिए (उपस्थिति संख्या, स्थल पर प्रवेश)।
misc.privacy.s3.heading=3. डेटा साझा करना
misc.privacy.s3.body=हम आपका व्यक्तिगत डेटा नहीं बेचते। अधिकृत C-DAC कार्यक्रम कर्मचारी और सेवा प्रदाता सेवा चलाने के लिए इसे संसाधित कर सकते हैं: होस्टिंग और डेटाबेस प्रदाता पंजीकरण तथा ऐप डेटा संग्रहीत करते हैं; C-DAC के ईमेल और SMS प्रदाता सत्यापन कोड और कार्यक्रम संदेश भेजते हैं; वॉइस सर्च चुनने पर आपके डिवाइस का स्पीच-रिकग्निशन प्रदाता ऑडियो संसाधित करता है; और दिशा-निर्देश खोलने पर आपका चुना हुआ मैप प्रदाता शुरुआती स्थान प्राप्त करता है। ये प्रदाता अपनी लागू गोपनीयता प्रथाओं के अनुसार डेटा संसाधित करते हैं। कानून द्वारा अपेक्षित होने पर या कार्यक्रम की सुरक्षा के लिए सरकारी सुरक्षा प्राधिकरणों द्वारा माँगे जाने पर हम डेटा प्रकट कर सकते हैं।
misc.privacy.s4.heading=4. सुरक्षा और डेटा प्रतिधारण
misc.privacy.s4.body=डेटा एन्क्रिप्टेड HTTPS कनेक्शन के माध्यम से भेजा जाता है। पासवर्ड हैश के रूप में संग्रहीत किए जाते हैं, ऐप सत्र डिवाइस के सुरक्षित स्टोरेज में रखे जाते हैं, और एडमिन सिस्टम तक पहुँच प्रतिबंधित है। हम पंजीकरण डेटा केवल तब तक रखते हैं जब तक Tec-Verse 2026 और उससे संबंधित रिपोर्टिंग के लिए आवश्यक हो, उसके बाद उसे हटा दिया जाता है या अनाम कर दिया जाता है।
misc.privacy.s5.heading=5. आपके विकल्प और खाता हटाना
misc.privacy.s5.bodyStart=आप ऐप में अपना विवरण देख सकते हैं, और किसी भी समय ऐप में <strong>प्रोफ़ाइल → खाता हटाएँ</strong> से, या हमारे
misc.privacy.s5.link=खाता हटाने संबंधी पृष्ठ
misc.privacy.s5.bodyEnd=\ पर दिए गए चरणों का पालन करके अपना खाता हटा सकते हैं। खाता हटाने पर आपका पंजीकरण, डिजिटल पास, प्राथमिकताएँ और सूचनाएँ स्थायी रूप से हट जाती हैं।
misc.privacy.s6.heading=6. बच्चे
misc.privacy.s6.body=यह कार्यक्रम और ऐप पेशेवरों, छात्रों और 13 वर्ष या उससे अधिक आयु के आगंतुकों के लिए है। हम जानबूझकर 13 वर्ष से कम आयु के बच्चों का डेटा एकत्र नहीं करते।
misc.privacy.s7.heading=7. परिवर्तन और संपर्क
misc.privacy.s7.body=हम इस नीति को अद्यतन कर सकते हैं; ऊपर दी गई तिथि नवीनतम संस्करण दर्शाती है। गोपनीयता से संबंधित किसी भी प्रश्न या अनुरोध के लिए हमसे <a href="mailto:tec-verse@cdac.in">tec-verse@cdac.in</a> पर संपर्क करें।
misc.deletion.pageTitle=अपना खाता हटाएँ | Tec-Verse 2026
misc.deletion.heading=अपना Tec-Verse खाता हटाएँ
misc.deletion.lead=C-DAC द्वारा Tec-Verse 2026 ऐप
misc.deletion.option1.heading=विकल्प 1: ऐप में हटाएँ (तत्काल)
misc.deletion.option1.step1=<strong>Tec-Verse 2026</strong> ऐप खोलें और साइन इन करें।
misc.deletion.option1.step2=<strong>प्रोफ़ाइल</strong> पर जाएँ और <strong>खाता हटाएँ</strong> पर टैप करें।
misc.deletion.option1.step3=पुष्टि के लिए अपना पासवर्ड दर्ज करें। आपका खाता तुरंत हटा दिया जाएगा।
misc.deletion.option2.heading=विकल्प 2: ईमेल द्वारा हटाने का अनुरोध करें
misc.deletion.option2.body=यदि आप ऐप का उपयोग नहीं कर सकते, तो अपने पंजीकृत ईमेल पते से <a href="mailto:tec-verse@cdac.in?subject=Account%20deletion%20request">tec-verse@cdac.in</a> पर ईमेल भेजें, जिसका विषय <strong>“Account deletion request”</strong> हो, और उसमें अपनी पंजीकरण संदर्भ संख्या (यदि उपलब्ध हो) लिखें। हम अनुरोध का सत्यापन करके 7 कार्य दिवसों के भीतर खाता हटा देंगे और ईमेल द्वारा पुष्टि करेंगे।
misc.deletion.deleted.heading=क्या हटाया जाता है
misc.deletion.deleted.item1=आपका पंजीकरण: नाम, ईमेल, मोबाइल नंबर, पासवर्ड, श्रेणी, संगठन और पासपोर्ट विवरण।
misc.deletion.deleted.item2=आपका डिजिटल कार्यक्रम पास और QR कोड, चेक-इन रिकॉर्ड, ऐप प्राथमिकताएँ और सूचनाएँ।
misc.deletion.note.start=खाता हटाने के बाद कुछ भी नहीं रखा जाता, सिवाय उस स्थिति के जहाँ कानून के अनुसार रिकॉर्ड रखना आवश्यक हो; ऐसा कोई भी रिकॉर्ड केवल कानून द्वारा निर्धारित अवधि तक ही रखा जाता है। विस्तृत जानकारी के लिए हमारी
misc.deletion.note.end=देखें।
