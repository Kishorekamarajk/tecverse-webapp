sponsor.faq.kicker=प्रश्नोत्तर
sponsor.faq.title=प्रायोजक संबंधी प्रश्नोत्तर
sponsor.faq.desc=Tec-Verse 2026 के साथ साझेदारी की योजना बना रहे ब्रांडों और संगठनों के लिए त्वरित उत्तर।
sponsor.faq.q1=कौन-कौन से प्रायोजक पैकेज उपलब्ध हैं?
sponsor.faq.a1=Tec-Verse प्रायोजन पाँच आधिकारिक पैकेजों के माध्यम से उपलब्ध है: प्लेटिनम, गोल्ड, सिल्वर, कॉपर और ब्रॉन्ज़। प्रत्येक पैकेज में ब्रांडिंग, पास, सत्र पहुँच, स्टॉल दृश्यता और आतिथ्य लाभों के अलग-अलग स्तर शामिल हैं।
sponsor.faq.q2=ईमेल OTP सत्यापन क्यों आवश्यक है?
sponsor.faq.a2=OTP सत्यापन यह पुष्टि करता है कि आधिकारिक ईमेल पता संगठन या अधिकृत संपर्क व्यक्ति का ही है। इससे टीम वास्तविक प्रायोजन पूछताछ पर शीघ्र प्रतिक्रिया दे पाती है।
sponsor.faq.q3=क्या हमें इस वेबसाइट पर भुगतान करना होगा?
sponsor.faq.a3=इस सार्वजनिक फ़ॉर्म के माध्यम से कोई बैंक, कार्ड या भुगतान विवरण एकत्र नहीं किया जाता है। फ़ॉर्म जमा करने के बाद, Tec-Verse टीम पैकेज पुष्टि, चालान विवरण और भुगतान संबंधी आगे की कार्यवाही के लिए आपसे संपर्क करेगी।
sponsor.faq.q4=प्रायोजकों को कौन-से ब्रांडिंग लाभ मिलते हैं?
sponsor.faq.a4=ब्रांडिंग लाभों में विपणन सामग्री, कार्यक्रम साइन बोर्ड और किट पर लोगो स्थान, मुख्य मंच ब्रांडिंग, कार्यक्रम रिपोर्ट में तकनीकी लेख तथा चयनित पैकेज के अनुसार अन्य दृश्यता लाभ शामिल हो सकते हैं।
sponsor.faq.q5=क्या प्रायोजन में स्टॉल स्थान शामिल है?
sponsor.faq.a5=हाँ, प्रायोजक पैकेजों में श्रेणी के अनुसार स्टॉल दृश्यता शामिल है। प्लेटिनम में प्रीमियम श्रेणी स्टॉल, गोल्ड में बड़ा स्टॉल, सिल्वर में मध्यम स्टॉल और कॉपर में छोटा स्टॉल शामिल है।
sponsor.faq.q6=कितने कार्यक्रम पास शामिल हैं?
sponsor.faq.a6=प्लेटिनम, गोल्ड, सिल्वर और कॉपर पैकेजों में 10 तकनीकी सत्र पास सूचीबद्ध हैं। VIP लाउंज और भोजन जैसी आतिथ्य सुविधाएँ पैकेज श्रेणी के अनुसार भिन्न होती हैं।
sponsor.faq.q7=क्या हम पैकेज संबंधी स्पष्टीकरण या बदलाव का अनुरोध कर सकते हैं?
sponsor.faq.a7=कृपया निकटतम आधिकारिक पैकेज चुनें और संदेश फ़ील्ड में अपनी आवश्यकता का उल्लेख करें। प्रायोजन टीम उसकी समीक्षा करेगी और स्पष्टीकरण के लिए आपसे संपर्क करेगी।
sponsor.faq.q8=फ़ॉर्म जमा करने के बाद क्या होता है?
sponsor.faq.a8=आपकी पूछताछ जमा होने के बाद, Tec-Verse टीम संगठन विवरण, पसंदीदा पैकेज और संदेश की समीक्षा करती है। इसके बाद टीम पुष्टि, दस्तावेज़ीकरण और आगे के चरणों के लिए आपसे संपर्क करेगी।

