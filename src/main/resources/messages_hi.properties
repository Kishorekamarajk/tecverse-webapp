about.journey.2025.desc=Tec-Verse 2025, MeitY का दो दिवसीय कार्यक्रम था, जिसका आयोजन C-DAC, SAMEER और C-MET ने संयुक्त रूप से किया। इसमें 150 से अधिक अत्याधुनिक तकनीकों का प्रदर्शन हुआ, 1,000 से अधिक प्रतिभागियों ने हिस्सा लिया और उद्योग के साथ उत्पाद लॉन्च, तकनीक हस्तांतरण तथा समझौता ज्ञापन हुए।
