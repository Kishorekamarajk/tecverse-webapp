ticket.faq.empty=FAQs will be updated soon.
ticket.faq.question.Will\ I\ receive\ a\ confirmation\ after\ registration?=Will I receive a confirmation after registration?
ticket.faq.answer.Yes.\ After\ successful\ registration,\ your\ confirmation\ details\ will\ be\ sent\ to\ the\ email\ address\ or\ phone\ number\ provided\ during\ registration.=Yes. After successful registration, your confirmation details will be sent to the email address or phone number provided during registration.
ticket.faq.question.Is\ there\ any\ registration\ fee\ for\ the\ event?=Is there any registration fee for the event?
ticket.faq.answer.No.\ Registration\ for\ the\ TecVerse\ event\ is\ completely\ free.\ There\ are\ no\ charges\ for\ attending\ the\ event.=No. Registration for the TecVerse event is completely free. There are no charges for attending the event.
ticket.faq.question.Will\ food\ be\ provided\ at\ the\ event?=Will food be provided at the event?
ticket.faq.answer.Complimentary\ meals\ will\ be\ provided\ to\ all\ registered\ participants\ throughout\ the\ event.=Complimentary meals will be provided to all registered participants throughout the event.
ticket.faq.question.How\ can\ I\ register\ for\ the\ event?=How can I register for the event?
ticket.faq.answer.Click\ on\ the\ Register\ Now\ button,\ fill\ in\ your\ details,\ verify\ your\ OTP,\ and\ complete\ your\ registration.\ Your\ participation\ will\ be\ confirmed\ after\ successful\ registration.=Click on the Register Now button, fill in your details, verify your OTP, and complete your registration. Your participation will be confirmed after successful registration.

about.title=Tec-verse 2026
about.pagetitle=About Tec-verse
about.tagline=A quick look at who we are and what we build.
about.story.heading=Our Story
about.story.p1=Tec-verse started as a simple idea: give teams a clean, modern starting point for their web presence, built on solid, well-known tools like Spring Boot, Thymeleaf, and Bootstrap.
about.story.p2=This inner page reuses the same navbar and footer fragments as the home page, so any change you make to those is reflected everywhere automatically.
about.placeholder=Image / content placeholder
about.hero.heading=About Tec-verse
about.hero.subtitle=A MeitY-backed technology showcase jointly organised by C-DAC, SAMEER, and C-MET to take indigenous R&D closer to industry and citizens.
about.section.eyebrow=About Tec-verse
about.section.p1=Tec-verse is a technology exhibition and conclave shaped by MeitY's premier R&D organisations: C-DAC, SAMEER, and C-MET. Its first edition, Tec-verse 2025, was held on 27-28 June 2025 at Manekshaw Centre, New Delhi, as a unified platform to showcase and commercialise indigenous deep-tech solutions.
about.section.p2=The 2025 edition brought together more than 150 technologies from domains including high-performance computing, quantum technologies, AI, cybersecurity, semiconductors, telecom, healthcare, agriculture, power electronics, robotics, UAVs, IoT, and Industry 4.0. It connected ministries, industry, startups, academia, and research communities around market-ready Indian technology.
about.journey.heading=Journey of Tec-verse
about.journey.subtitle=From the first MeitY R&D showcase in 2025 to the next platform for Indian deep-tech collaboration.
about.journey.2023.title=Laying the Foundation
about.journey.2023.desc=The inaugural edition brought together early innovators, government bodies, and academia, introducing the core thematic areas that would define Tec-verse in the years ahead.
about.journey.2024.title=Expanding Horizons
about.journey.2024.desc=Participation grew across exhibitors, speakers, and partner organizations, with new thematic tracks in AI, cybersecurity, and semiconductor technologies joining the fold.
about.journey.2025.title=First Edition in New Delhi
about.journey.2025.desc=Tec-verse 2025 was launched as a two-day MeitY event jointly organised by C-DAC, SAMEER, and C-MET. It showcased 150+ cutting-edge technologies, welcomed 1000+ participants, and recorded product launches, technology transfers, and MoUs with industry.
about.why.heading=Why Tec-verse
about.why.subtitle=A platform built to move publicly funded research from laboratories into real-world adoption.
about.why.card1.title=R&D to Industry Connect
about.why.card1.desc=Bringing industry into early engagement with technologies developed by C-DAC, SAMEER, and C-MET.
about.why.card2.title=MeitY R&D Strength
about.why.card2.desc=Anchored by national R&D institutions working under the Ministry of Electronics and Information Technology.
about.why.card3.title=Deep-Tech Collaboration
about.why.card3.desc=Creating space for ministries, startups, academia, and enterprises to explore co-development and adoption.
