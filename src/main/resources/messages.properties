# ---- misc ----
misc.privacy.pageTitle=Privacy Policy | Tec-Verse 2026
misc.privacy.heading=Privacy Policy
misc.privacy.lead=Tec-Verse 2026 website and mobile app · Last updated: 28 October 2026
misc.privacy.intro=Tec-Verse 2026 is organised by the Centre for Development of Advanced Computing (C-DAC). This policy explains what personal data we collect through the Tec-Verse website (https://tec-verse.cdac.in) and the Tec-Verse 2026 mobile application (Android package: in.cdac.tecverse.tec_app), why we collect it, and the choices you have.
misc.privacy.s1.heading=1. Data we collect
misc.privacy.s1.registration=<strong>Registration details:</strong> name, email address, mobile number, password (stored only as a one-way hash), registration category, organisation / institution, designation, city, student ID (students only) and preferred attendance days.
misc.privacy.s1.passport=<strong>Passport details (foreign nationals only):</strong> passport number, expiry date and name as shown on the passport, used for event security and entry.
misc.privacy.s1.enquiries=<strong>Exhibitor and sponsor enquiries:</strong> company and contact details, and documents you upload.
misc.privacy.s1.appUsage=<strong>App usage:</strong> technology interests you select, text questions you submit to the in-app event FAQ search (including text recognised from voice input), notifications shown to you, and your event check-in status.
misc.privacy.s1.microphone=<strong>Microphone (optional):</strong> only when you start voice search, your device's speech-recognition service processes audio and returns recognised text to the app. Audio processing is subject to that service provider's privacy practices; Tec-Verse receives the recognised text and does not record or store audio.
misc.privacy.s1.note=The app does not access your device's GPS location, contacts, photos or advertising identifier. If you enter a starting point and choose directions, that starting point is included in a link opened with your selected maps provider. We do not use personal data for advertising.
misc.privacy.s2.heading=2. How we use it
misc.privacy.s2.item1=To register you for the event, issue your digital pass and QR code, and verify entry at the venue.
misc.privacy.s2.item2=To verify your email with a one-time password (OTP) and to let you reset your password.
misc.privacy.s2.item3=To send event updates, confirmations and notifications related to Tec-Verse 2026.
misc.privacy.s2.item4=To plan and secure the event (attendance numbers, venue access).
misc.privacy.s3.heading=3. Sharing
misc.privacy.s3.body=We do not sell your personal data. Authorised C-DAC event staff and service providers may process it to operate the service: hosting and database providers store registration and app data; C-DAC email and SMS providers deliver verification codes and event messages; your device's speech-recognition provider processes audio when you choose voice search; and your selected maps provider receives a starting point only when you open directions. These providers process data under their own applicable privacy practices. We may disclose data where required by law or by government security authorities for event security.
misc.privacy.s4.heading=4. Security and retention
misc.privacy.s4.body=Data is sent over encrypted HTTPS connections. Passwords are stored as hashes, app sessions are stored in the device's secure storage, and access to the admin system is restricted. We keep registration data only as long as needed for Tec-Verse 2026 and related reporting, after which it is deleted or anonymised.
misc.privacy.s5.heading=5. Your choices and account deletion
misc.privacy.s5.bodyStart=You can view your details in the app, and you can delete your account at any time from <strong>Profile → Delete Account</strong> in the app, or by following the steps on our
misc.privacy.s5.link=account deletion page
misc.privacy.s5.bodyEnd=. Deleting your account permanently removes your registration, digital pass, preferences and notifications.
misc.privacy.s6.heading=6. Children
misc.privacy.s6.body=The event and app are intended for professionals, students and visitors aged 13 and above. We do not knowingly collect data from children under 13.
misc.privacy.s7.heading=7. Changes and contact
misc.privacy.s7.body=We may update this policy; the date above shows the latest version. For any privacy question or request, contact us at <a href="mailto:tec-verse@cdac.in">tec-verse@cdac.in</a>.
misc.deletion.pageTitle=Delete Your Account | Tec-Verse 2026
misc.deletion.heading=Delete your Tec-Verse account
misc.deletion.lead=Tec-Verse 2026 app by C-DAC
misc.deletion.option1.heading=Option 1: Delete in the app (immediate)
misc.deletion.option1.step1=Open the <strong>Tec-Verse 2026</strong> app and sign in.
misc.deletion.option1.step2=Go to <strong>Profile</strong> and tap <strong>Delete Account</strong>.
misc.deletion.option1.step3=Enter your password to confirm. Your account is deleted immediately.
misc.deletion.option2.heading=Option 2: Request deletion by email
misc.deletion.option2.body=If you cannot use the app, send an email from your registered email address to <a href="mailto:tec-verse@cdac.in?subject=Account%20deletion%20request">tec-verse@cdac.in</a> with the subject <strong>“Account deletion request”</strong> and your registration reference number (if you have it). We verify the request and delete the account within 7 working days, and confirm by email.
misc.deletion.deleted.heading=What is deleted
misc.deletion.deleted.item1=Your registration: name, email, mobile number, password, category, organisation and passport details.
misc.deletion.deleted.item2=Your digital event pass and QR code, check-in record, app preferences and notifications.
misc.deletion.note.start=Nothing is kept after deletion, except where the law requires us to keep a record; any such record is kept only for the period the law requires. See our
misc.deletion.note.end=for details.
