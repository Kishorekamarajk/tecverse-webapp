sponsor.faq.kicker=FAQ
sponsor.faq.title=Sponsor FAQ
sponsor.faq.desc=Quick answers for brands and organisations planning to partner with Tec-Verse 2026.
sponsor.faq.q1=Which sponsor packages are available?
sponsor.faq.a1=Tec-Verse sponsorship is available through five official packages: Platinum, Gold, Silver, Copper and Bronze. Each package includes different levels of branding, passes, session access, stall visibility and hospitality benefits.
sponsor.faq.q2=Why is email OTP verification required?
sponsor.faq.a2=OTP verification confirms that the official email address belongs to the organisation or authorised contact person. This helps the team respond to genuine sponsorship enquiries faster.
sponsor.faq.q3=Do we need to pay on this website?
sponsor.faq.a3=No bank, card or payment details are collected through this public form. After submission, the Tec-Verse team will contact you for package confirmation, invoice details and payment follow-up.
sponsor.faq.q4=What branding benefits do sponsors receive?
sponsor.faq.a4=Branding benefits can include logo placement on marketing materials, event sign boards, kits, main-stage branding, technical write-up in the event report and other visibility benefits based on the selected package.
sponsor.faq.q5=Is stall space included in sponsorship?
sponsor.faq.a5=Yes, sponsor packages include stall visibility according to the tier. Platinum includes a premium category stall, Gold includes a large stall, Silver includes a medium stall and Copper includes a small stall.
sponsor.faq.q6=How many event passes are included?
sponsor.faq.a6=Platinum, Gold, Silver and Copper packages list 10 technical session passes. Hospitality access such as VIP lounge and dining varies by package tier.
sponsor.faq.q7=Can we request package clarification or changes?
sponsor.faq.a7=Please select the closest official package and mention your requirement in the message field. The sponsorship team will review it and contact you for clarification.
sponsor.faq.q8=What happens after form submission?
sponsor.faq.a8=After your enquiry is submitted, the Tec-Verse team reviews the organisation details, preferred package and message. They will then contact you for confirmation, documentation and next steps.

